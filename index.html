ve costs. It is a loving line but a revealing one: he sees marriage as a kind of confinement he chooses.","ask":"What does it suggest that his first statement of love is about what he sacrifices?","rev":"Love as a price; marriage as confinement he chooses.","a":25,"b":28},{"id":"n32","ph":"I must be found","title":"Visible against hidden","tags":["dec","voice"],"meaning":"Iago tells Othello to hide. Othello refuses: his qualities and clear conscience will “manifest” him rightly.","effect":"This is the direct opposite of “I am not what I am”. Othello believes that what he is can be seen. That openness is attractive and honourable. It is also what Iago will use against him.","ask":"How does this line make Iago’s speech in 1.1 stand out?","rev":"“I must be found” v. “I am not what I am”.","a":30,"b":32},{"id":"n33","ph":"By Janus","title":"A telling oath","tags":["dec","ctx"],"meaning":"Janus was the Roman god of doorways, shown with two faces looking opposite ways.","effect":"Iago swears by the two-faced god just as he is lying to Othello’s face. Many in a Renaissance audience would know the reference. It works as a joke the audience shares with Shakespeare.","rev":"Iago swears by the two-faced god.","a":33,"b":33}],"lens":{"themes":"Power: Othello’s authority rests on state service. Race & otherness: he answers prejudice with rank and composure. Deception: Iago lies to his face; Othello’s open nature is clear. Family & love: love is described as freedom given up.","form":"Othello’s speech is measured blank verse, long and full. The shared line at 17 shows how he answers Iago before he has finished. Compare the energy of Iago’s tricky, fast sentences.","structure":"This is a deliberate contrast: the first Othello scene follows the first Iago scene. Two pairs of characters stand in the street: schemers in the dark, and a man who steps into the light.","language":"Confident first-person nouns (my services, my parts, my title, my perfect soul), words of display and honesty (found, manifest), money and sea (the sea’s worth) and nautical language (cable)."},"chunks":[{"who":"Iago","g":"Iago warns Othello: Brabantio is much loved, his voice in the council counts nearly as much as the Duke’s, and he will either divorce Othello from Desdemona or impose any penalty the law allows, given enough rope.","lines":[{"n":14,"t":"As double as the duke’s: he will divorce you;","sh":false,"k":"v"},{"n":15,"t":"Or put upon you what restraint and grievance","sh":false,"k":"v"},{"n":16,"t":"The law, with all his might to enforce it on,","sh":false,"k":"v"},{"n":17,"t":"Will give him cable.","sh":false,"k":"v"}],"n":14,"sh":false},{"who":"Othello","g":"Othello answers at once: “Let him do his worst.”","lines":[{"n":17,"t":"Let him do his spite:","sh":true,"k":"v"}],"n":17,"sh":true},{"who":"Othello","g":"“My services to the state will drown out his complaints. And I haven’t yet made public—but I will when boasting is respectable—that I come from men of royal descent, and my merits can face as proud a fortune as the one I have reached.”","lines":[{"n":18,"t":"My services which I have done the signiory","sh":false,"k":"v"},{"n":19,"t":"Shall out-tongue his complaints. ’Tis yet to know,—","sh":false,"k":"v"},{"n":20,"t":"Which, when I know that boasting is an honor,","sh":false,"k":"v"},{"n":21,"t":"I shall promulgate—I fetch my life and being","sh":false,"k":"v"},{"n":22,"t":"From men of royal siege, and my demerits","sh":false,"k":"v"},{"n":23,"t":"May speak unbonneted to as proud a fortune","sh":false,"k":"v"},{"n":24,"t":"As this that I have reach’d: for know, Iago,","sh":false,"k":"v"}],"n":18,"sh":false},{"who":"Othello","g":"“And, Iago, if I did not love gentle Desdemona I would not trade my free, homeless life for confinement, not for all the treasure of the sea. But look, what lights are those?”","lines":[{"n":25,"t":"But that I love the gentle Desdemona,","sh":false,"k":"v"},{"n":26,"t":"I would not my unhoused free condition","sh":false,"k":"v"},{"n":27,"t":"Put into circumscription and confine","sh":false,"k":"v"},{"n":28,"t":"For the sea’s worth. But, look! what lights come yond?","sh":false,"k":"v"}],"n":25,"sh":false},{"who":"Iago","g":"Iago: “That’s the father and his supporters, roused. You had better go in.”","lines":[{"n":29,"t":"Those are the raised father and his friends:","sh":false,"k":"v"},{"n":30,"t":"You were best go in.","sh":false,"k":"v"}],"n":29,"sh":false},{"who":"Othello","g":"Othello: “Not me. I must be found. My abilities, my rank and my clear conscience will show me as I am. Is it them?”","lines":[{"n":30,"t":"Not I, I must be found:","sh":true,"k":"v"},{"n":31,"t":"My parts, my title and my perfect soul","sh":false,"k":"v"},{"n":32,"t":"Shall manifest me rightly. Is it they?","sh":false,"k":"v"}],"n":30,"sh":true},{"who":"Iago","g":"Iago: “By Janus, I don’t think so.”","lines":[{"n":33,"t":"By Janus, I think no.","sh":false,"k":"v"}],"n":33,"sh":false}],"range":[14,33]},{"id":"e6","lesson":2,"label":"Extract 6","scene":2,"title":"“The sooty bosom of such a thing as thou”","short":"1.2 Accusation","sub":"Brabantio meets Othello in the street, with swords drawn. Contrast their words.","setup":"Brabantio arrives with torches and officers. Weapons are drawn. Othello speaks first.","task":"Mark Othello’s words in one colour and Brabantio’s in another. Compare the length of their speeches and how each addresses the other.","notes":[{"id":"n34","ph":"Keep up your bright swords","title":"Wit as a form of control","tags":["pow","voice","lang"],"meaning":"“Keep up” means put away. Othello says the dew will rust the swords.","effect":"A man facing violence makes a gentle, slightly humorous remark. This is understatement and it shows total command of the situation. The “bright swords” and the “dew” also give the scene a quiet, nocturnal beauty at the height of the threat.","rev":"Understatement shows control.","a":59,"b":59},{"id":"n35","ph":"you shall more command with years","title":"Courtesy to the old man","tags":["pow","voice"],"meaning":"Othello says Brabantio will have more authority through his age than through weapons.","effect":"Othello is polite and respectful (“Good signior”) even as he is accused. He accepts the old social order that Brabantio stands for and uses it to calm the scene. The audience is shown who is behaving with honour.","ask":"Compare how each man addresses the other.","rev":"Othello is courteous; Brabantio abusive.","a":60,"b":61},{"id":"n36","ph":"where hast thou stow’d my daughter","title":"“Stow’d”: a daughter stored like goods","tags":["pat","dec","lang"],"meaning":"“Stow’d” means stored away, as cargo is packed.","effect":"Brabantio repeats Iago’s word “thief” and now pictures Desdemona as stolen goods hidden by the thief. The rumour has spread from Iago to a respected senator, which shows how quickly his false picture takes hold.","rev":"“Thief”, “stow’d”: the property image continues.","a":62,"b":62},{"id":"n37","ph":"thou hast enchanted her","title":"Magic as the only explanation","tags":["race","pat","ctx"],"meaning":"Brabantio claims Othello used spells to make Desdemona love him.","effect":"A belief in witchcraft was real in Shakespeare’s England. But the dramatic point is Brabantio’s need for the explanation: he cannot accept that Desdemona chose Othello freely, so he blames magic. “Damn’d” also pushes Othello towards hell.","rev":"Magic denies Desdemona’s choice.","a":63,"b":63},{"id":"n38","ph":"a maid so tender, fair and happy","title":"Brabantio speaks for his daughter","tags":["pat","voice"],"meaning":"He describes Desdemona as gentle, beautiful, content and unwilling to marry, one who even turned away wealthy Venetian suitors.","effect":"This picture is Brabantio’s idea of her, delivered in her absence. It is also contradictory: if she was so opposed to marriage, why did she marry? He cannot see that the contradiction suggests his portrait may be wrong. She has no voice here.","ask":"Whose voice is missing from this speech, and whose “truth” are we being given?","rev":"A father describes his daughter and gets her wrong.","a":66,"b":68},{"id":"n39","ph":"sooty bosom","title":"Colour as dirt; Othello as a “thing”","tags":["race","pat","lang"],"meaning":"“Guardage” means guardianship. “Sooty” means black like soot. “Thing” is a contemptuous word for a person.","effect":"Three words do the work: “guardage” treats Desdemona as a ward in his keeping, “sooty” makes Othello’s skin a stain, and “thing” denies his personhood. The final phrase, “to fear, not to delight”, claims that any woman would be terrified of him.","ask":"Which of these three words is most dehumanising? Why?","rev":"“Guardage”, “sooty”, “thing”: ownership and racism together.","stretch":"Compare “thing” here with “beast” (1.1.116) and “ram” (1.1.88).","a":69,"b":71},{"id":"n40","ph":"gross in sense","title":"“It is obvious”: assumption as proof","tags":["dec","voice","struct"],"meaning":"“Gross in sense” means plain to the senses. “Palpable” means can be touched.","effect":"Brabantio keeps saying that the charge is obvious. When someone repeats that something is obvious and offers no evidence, they are usually using feeling in place of logic. The scene sets up the Duke’s demand in 1.3 for “more wider and more overt test”.","rev":"Obviousness is not evidence (the Duke will say so).","a":72,"b":76},{"id":"n41","ph":"apprehend and do attach thee","title":"A father’s grief in the language of law","tags":["pow","form"],"meaning":"“Apprehend” and “attach” are legal verbs for arresting someone.","effect":"Brabantio moves from rage to formal legal language. This shows him using his position as a senator: he believes the law and the family order are on his side. The rhythm becomes more regular and official.","rev":"Legal language: he thinks the system is on his side.","a":77,"b":79},{"id":"n42","ph":"Without a prompter","title":"Othello uses a theatre image","tags":["pow","lang"],"meaning":"A “cue” is the signal for an actor’s line or action; a prompter reminds actors of their lines.","effect":"A stage metaphor in a stage play: Othello says he knows when to fight and doesn’t need to be told. It reinforces his ease and self-possession. He halts the fight with a single sentence.","rev":"Metatheatre: he doesn’t need a prompter.","a":83,"b":84},{"id":"n43","ph":"Whose messengers are here about my side","title":"The state needs Othello more than Brabantio does","tags":["pow","struct"],"meaning":"The Duke’s officers are standing next to Othello with urgent business.","effect":"Othello uses Venice’s need as protection. The scene turns on the arrival of the officers, which moves the dispute from the street to the council chamber. The audience sees that Brabantio’s authority is private and Othello’s is public.","ask":"How does the arrival of the Duke’s officers shift the balance of power?","rev":"Private authority (Brabantio) v. public need (Othello).","a":88,"b":89}],"lens":{"themes":"Race & otherness: prejudice is argued as logic (“sooty”, “thing”). Patriarchy: Desdemona is a ward, a prize, a thing stowed. Power: the street gives way to the state. Deception: a lie spreads from Iago to a senator.","form":"Brabantio’s accusation is one long, hurtling speech (about 20 lines); Othello’s reply is short and measured. Length shows who is controlling the situation. Shared lines (81, 85, 87) show the two men answering each other quickly.","structure":"Scene 2 is a hinge between the private world of the family and the public world of the state. The threat of violence in the street is defused by the arrival of the Duke’s officers, and the argument moves to a council chamber.","language":"Legal words (apprehend, attach, charge), magic words (charms, drugs, minerals, arts inhibited), words of dirt and darkness (sooty), and the dehumanising “thing”. Othello’s words are courteous, short and light in contrast."},"chunks":[{"who":"Othello","g":"“Put away your bright swords, because the dew will rust them. Good sir, you will command more through your age than through your weapons.”","lines":[{"n":59,"t":"Keep up your bright swords, for the dew will rust them.","sh":false,"k":"v"},{"n":60,"t":"Good signior, you shall more command with years","sh":false,"k":"v"},{"n":61,"t":"Than with your weapons.","sh":false,"k":"v"}],"n":59,"sh":false},{"who":"Brabantio","g":"“You foul thief, where have you hidden my daughter? Damned as you are, you have bewitched her. I appeal to everything sensible: unless she were bound in chains of magic,”","lines":[{"n":62,"t":"O thou foul thief, where hast thou stow’d my daughter?","sh":false,"k":"v"},{"n":63,"t":"Damn’d as thou art, thou hast enchanted her;","sh":false,"k":"v"},{"n":64,"t":"For I’ll refer me to all things of sense,","sh":false,"k":"v"},{"n":65,"t":"If she in chains of magic were not bound,","sh":false,"k":"v"}],"n":62,"sh":false},{"who":"Brabantio","g":"“would a girl so tender, fair and happy, so opposed to marriage that she turned down the wealthy, curly-haired darlings of our nation, have run away from her father’s protection, risking public scorn, to the black chest of a thing like you, to feel fear, not delight?”","lines":[{"n":66,"t":"Whether a maid so tender, fair and happy,","sh":false,"k":"v"},{"n":67,"t":"So opposite to marriage that she shunned","sh":false,"k":"v"},{"n":68,"t":"The wealthy curled darlings of our nation,","sh":false,"k":"v"},{"n":69,"t":"Would ever have, to incur a general mock,","sh":false,"k":"v"},{"n":70,"t":"Run from her guardage to the sooty bosom","sh":false,"k":"v"},{"n":71,"t":"Of such a thing as thou, to fear, not to delight.","sh":false,"k":"v"}],"n":66,"sh":false},{"who":"Brabantio","g":"“Let the world judge: isn’t it plain that you have practised on her with foul charms and weakened her young mind with drugs or potions? I will have this argued out. It’s plain and obvious to anyone who thinks.”","lines":[{"n":72,"t":"Judge me the world, if ’tis not gross in sense","sh":false,"k":"v"},{"n":73,"t":"That thou hast practiced on her with foul charms,","sh":false,"k":"v"},{"n":74,"t":"Abused her delicate youth with drugs or minerals","sh":false,"k":"v"},{"n":75,"t":"That weaken motion: I’ll have’t disputed on;","sh":false,"k":"v"},{"n":76,"t":"’Tis probable and palpable to thinking.","sh":false,"k":"v"}],"n":72,"sh":false},{"who":"Brabantio","g":"“So I arrest you as a corrupter of the world and a practitioner of forbidden arts. Seize him, and if he resists, overpower him, at his own risk.”","lines":[{"n":77,"t":"I therefore apprehend and do attach thee","sh":false,"k":"v"},{"n":78,"t":"For an abuser of the world, a practicer","sh":false,"k":"v"},{"n":79,"t":"Of arts inhibited and out of warrant.","sh":false,"k":"v"},{"n":80,"t":"Lay hold upon him: if he do resist,","sh":false,"k":"v"},{"n":81,"t":"Subdue him at his peril.","sh":false,"k":"v"}],"n":77,"sh":false},{"who":"Othello","g":"Othello: “Hold your hands, all of you, both my men and the rest. If I were meant to fight, I would know when without being prompted. Where do you want me to go to answer this charge?”","lines":[{"n":81,"t":"Hold your hands,","sh":true,"k":"v"},{"n":82,"t":"Both you of my inclining, and the rest:","sh":false,"k":"v"},{"n":83,"t":"Were it my cue to fight, I should have known it","sh":false,"k":"v"},{"n":84,"t":"Without a prompter. Where will you that I go","sh":false,"k":"v"},{"n":85,"t":"To answer this your charge?","sh":false,"k":"v"}],"n":81,"sh":true},{"who":"Brabantio","g":"Brabantio: “To prison, until the proper time for a formal trial.”","lines":[{"n":85,"t":"To prison, till fit time","sh":true,"k":"v"},{"n":86,"t":"Of law and course of direct session","sh":false,"k":"v"},{"n":87,"t":"Call thee to answer.","sh":false,"k":"v"}],"n":85,"sh":true},{"who":"Othello","g":"Othello: “And if I obey? How will the Duke be satisfied, when his messengers are here at my side with urgent state business to bring me to him?”","lines":[{"n":87,"t":"What if I do obey?","sh":true,"k":"v"},{"n":88,"t":"How may the duke be therewith satisfied,","sh":false,"k":"v"},{"n":89,"t":"Whose messengers are here about my side,","sh":false,"k":"v"},{"n":90,"t":"Upon some present business of the state","sh":false,"k":"v"},{"n":91,"t":"To bring me to him?","sh":false,"k":"v"}],"n":87,"sh":true}],"range":[59,91]},{"id":"e7","lesson":2,"label":"Extract 7","scene":3,"title":"“Rude am I in my speech”","short":"1.3 Defence","sub":"Othello is called before the Duke and speaks for himself for the first time.","setup":"In the council chamber the Duke is dealing with a Turkish threat to Cyprus when Brabantio brings his accusation. The Duke asks Othello to answer.","task":"Mark any words in Othello’s speech that suggest modesty, honesty or plainness. Then mark any that are the opposite. What do you notice?","notes":[{"id":"n44","ph":"My very noble and approved good masters","title":"Respect for the men who have power over him","tags":["race","pow","voice"],"meaning":"Othello addresses the senators in a stack of respectful titles.","effect":"He is an outsider in the room, a foreign general hired by Venice. “Masters” is a polite title, but it also reminds the audience of his position: a servant of the state. The courtesy is real and also strategic.","rev":"Courtesy and position: a foreign general among Venetian masters.","a":76,"b":77},{"id":"n45","ph":"It is most true; true, I have married her","title":"A direct admission","tags":["voice","pat","fam"],"meaning":"Othello does not deny taking Desdemona. His repetition (“true; true”) adds weight.","effect":"He starts with the facts, plainly. “Ta’en away” echoes the theft language of 1.1 and 1.2, but he reframes the event as a marriage. He is calm where Brabantio was frantic.","rev":"Plain facts, repeated; the theft language reframed as marriage.","a":78,"b":79},{"id":"n46","ph":"Rude am I in my speech","title":"Modesty before a masterpiece","tags":["voice","lang","irony"],"meaning":"“Rude” means unpolished. Othello says he has little skill with the “soft phrase of peace”.","effect":"This is the classic move of apologising for lack of skill before delivering a skilful speech. The irony is that his “rude” speech is among the most eloquent in the play. It also answers Iago’s image of him as a windbag with “bombast”.","ask":"Is Othello being honest or tactical when he calls himself “rude”?","rev":"Modesty topos: “rude” speaker, beautiful speech.","a":81,"b":81},{"id":"n47","ph":"tented field","title":"A life lived in camps","tags":["race","voice"],"meaning":"Othello says that since the age of seven his arms have been busy in war, so he knows little of the “great world” beyond battle.","effect":"He presents himself as a soldier, an outsider to Venetian drawing rooms. It explains his naivety about people like Iago and foreshadows how easily he could be manipulated by someone who understands social games.","rev":"A soldier’s life: strength and a blind spot.","a":83,"b":87},{"id":"n48","ph":"a round unvarnish’d tale","title":"“Unvarnished”: no cosmetic covering","tags":["voice","dec"],"meaning":"“Round” means plain and direct. “Unvarnished” means without polish.","effect":"Othello promises to say things as they are. This is the opposite of Iago’s approach (“trimm’d in forms and visages”). The word “tale” also announces that this will be a story, which gives him a power the other characters do not have.","rev":"Plain story v. Iago’s costume.","a":90,"b":90},{"id":"n49","ph":"what drugs, what charms","title":"A list that mocks the accusation","tags":["lang","voice"],"meaning":"Othello repeats the accusation in a list: drugs, charms, conjuration, magic.","effect":"Piling up the accusation shows how absurd it sounds when said aloud. The building list (drugs, charms, conjuration, mighty magic) climbs in size, then he drops the answer in a short sentence: “I won his daughter.”","rev":"Accumulation: the charge sounds absurd when listed.","a":91,"b":93},{"id":"n50","ph":"what she fear’d to look on","title":"“What”: Othello as an object again","tags":["race","pat","voice"],"meaning":"Brabantio says Desdemona fell in love against nature, age, country and reputation, with what she was afraid to look at.","effect":"“What” rather than “whom” makes Othello a thing again. The list (“nature, years, country, credit”) shows what Brabantio thinks she has ignored, and every item is social: he cannot imagine love crossing these lines.","rev":"“What she fear’d to look on”: Othello as a thing.","a":94,"b":98},{"id":"n51","ph":"practices of cunning hell","title":"Prejudice that proves itself","tags":["race","dec"],"meaning":"Brabantio says her love is so unnatural that only black magic from hell can explain it.","effect":"This reasoning goes in a circle: she could not love him, so he must have used magic, so her love proves the magic. Shakespeare shows prejudice as a closed argument that cannot be tested.","ask":"Why is a circular argument hard to answer?","rev":"Circular reasoning: love = proof of magic.","a":99,"b":106},{"id":"n52","ph":"thin habits and poor likelihoods","title":"The Duke asks for evidence","tags":["dec","pow","lang"],"meaning":"“Habits” are clothes, and “seeming” is outward appearance. The Duke says such thin coverings are not proof.","effect":"The Duke applies the idea of seeming and reality in a courtroom setting: appearances and probabilities are not evidence. The statement is fair and, in the play’s irony, it is an accurate warning that Othello will ignore in Act 3.","rev":"“Seeming” in court: appearance is not proof. Remember in Act 3.","a":106,"b":109}],"lens":{"themes":"Voice & storytelling: Othello’s first long speech and his promise of a plain tale. Race & otherness: Brabantio’s argument depends on prejudice. Power: the Duke, a legal authority, asks for evidence. Patriarchy: Desdemona is described and discussed but has not yet spoken.","form":"Othello’s speech is measured, formal blank verse with long, flowing sentences. Brabantio’s reply is angry and uses emphatic breaks in the line. The Duke’s lines are clipped and legal. Three voices, three rhythms.","structure":"A formal trial scene: accusation, defence, counter-accusation, ruling. The audience waits for Desdemona to be called, which delays her voice and underlines that men decide about her. Othello’s plain-speech claim sets up the story he tells next.","language":"Modesty (rude, little, unvarnish’d), a list of magic (drugs, charms, conjuration, mighty magic), cosmetic image (varnish), and Brabantio’s hell and nature vocabulary. The Duke’s “thin habits” puts the clothes image in a legal setting."},"chunks":[{"who":"Othello","g":"Othello: “Powerful, serious and respected lords, my honoured masters: it is true that I have taken this old man’s daughter, and true that I have married her. That is the full extent of my offence.”","lines":[{"n":76,"t":"Most potent, grave, and reverend signiors,","sh":false,"k":"v"},{"n":77,"t":"My very noble and approved good masters,","sh":false,"k":"v"},{"n":78,"t":"That I have ta’en away this old man’s daughter,","sh":false,"k":"v"},{"n":79,"t":"It is most true; true, I have married her:","sh":false,"k":"v"},{"n":80,"t":"The very head and front of my offending","sh":false,"k":"v"}],"n":76,"sh":false},{"who":"Othello","g":"“I am rough in speech and not much blessed with the soft words of peace. From the age of seven, until about nine months ago, my arms have spent their best strength in camp and battlefield.”","lines":[{"n":81,"t":"Hath this extent, no more. Rude am I in my speech,","sh":false,"k":"v"},{"n":82,"t":"And little bless’d with the soft phrase of peace:","sh":false,"k":"v"},{"n":83,"t":"For since these arms of mine had seven years’ pith,","sh":false,"k":"v"},{"n":84,"t":"Till now some nine moons wasted, they have used","sh":false,"k":"v"},{"n":85,"t":"Their dearest action in the tented field,","sh":false,"k":"v"}],"n":81,"sh":false},{"who":"Othello","g":"“I can say little about this great world except what concerns war, so I will do my case little credit by speaking for myself. But, with your kind patience, I will tell the plain, unpolished story”","lines":[{"n":86,"t":"And little of this great world can I speak,","sh":false,"k":"v"},{"n":87,"t":"More than pertains to feats of broil and battle,","sh":false,"k":"v"},{"n":88,"t":"And therefore little shall I grace my cause","sh":false,"k":"v"},{"n":89,"t":"In speaking for myself. Yet, by your gracious patience,","sh":false,"k":"v"}],"n":86,"sh":false},{"who":"Othello","g":"“of my whole courtship: what drugs, what charms, what spells and mighty magic I am charged with using to win his daughter.”","lines":[{"n":90,"t":"I will a round unvarnish’d tale deliver","sh":false,"k":"v"},{"n":91,"t":"Of my whole course of love; what drugs, what charms,","sh":false,"k":"v"},{"n":92,"t":"What conjuration and what mighty magic,","sh":false,"k":"v"},{"n":93,"t":"For such proceeding I am charged withal,","sh":false,"k":"v"},{"n":94,"t":"I won his daughter.","sh":false,"k":"v"}],"n":90,"sh":false},{"who":"Brabantio","g":"Brabantio: “A girl who was never bold, so quiet and gentle that she blushed at herself. And she, against nature, her age, her country and her reputation, fell in love with what she was afraid to look at!”","lines":[{"n":94,"t":"A maiden never bold;","sh":true,"k":"v"},{"n":95,"t":"Of spirit so still and quiet, that her motion","sh":false,"k":"v"},{"n":96,"t":"Blush’d at herself; and she, in spite of nature,","sh":false,"k":"v"},{"n":97,"t":"Of years, of country, credit, every thing,","sh":false,"k":"v"},{"n":98,"t":"To fall in love with what she fear’d to look on!","sh":false,"k":"v"}],"n":94,"sh":true},{"who":"Brabantio","g":"“Only a flawed and crippled judgement could admit that such perfection could fall so far against nature, and it must be driven to find the practices of cunning hell to explain it. So I say again that he worked on her with potent mixtures for the blood or a magic drink.”","lines":[{"n":99,"t":"It is a judgment maim’d and most imperfect","sh":false,"k":"v"},{"n":100,"t":"That will confess perfection so could err","sh":false,"k":"v"},{"n":101,"t":"Against all rules of nature, and must be driven","sh":false,"k":"v"},{"n":102,"t":"To find out practices of cunning hell,","sh":false,"k":"v"},{"n":103,"t":"Why this should be. I therefore vouch again","sh":false,"k":"v"},{"n":104,"t":"That with some mixtures powerful o’er the blood,","sh":false,"k":"v"},{"n":105,"t":"Or with some dram conjured to this effect,","sh":false,"k":"v"},{"n":106,"t":"He wrought upon her.","sh":false,"k":"v"}],"n":99,"sh":false},{"who":"Duke","g":"The Duke: “To claim this is no proof, without a more open and stronger test than these thin outward appearances and weak probabilities.”","lines":[{"n":106,"t":"To vouch this, is no proof,","sh":true,"k":"v"},{"n":107,"t":"Without more wider and more overt test","sh":false,"k":"v"},{"n":108,"t":"Than these thin habits and poor likelihoods","sh":false,"k":"v"},{"n":109,"t":"Of modern seeming do prefer against him.","sh":false,"k":"v"}],"n":106,"sh":true}],"range":[76,109]},{"id":"e8","lesson":3,"label":"Extract 8","scene":3,"title":"“This only is the witchcraft I have used”","short":"1.3 The tale","sub":"Othello tells the story of his courtship. The accusation of magic is answered with words.","setup":"The Duke has asked Othello to explain how he won Desdemona. Othello’s answer is the longest speech of the scene.","task":"Underline the places where Othello describes Desdemona’s actions. What does she do? What does he do? Who starts each stage of the courtship?","notes":[{"id":"n53","ph":"Her father loved me","title":"Welcomed as a guest, not as family","tags":["race","fam","pat"],"meaning":"Othello says Brabantio loved him and often invited him to his house.","effect":"Brabantio’s love for Othello was real, but it was the love one gives to a fascinating visitor. Once the guest becomes a son-in-law, the welcome ends. The line exposes how conditional acceptance can be, and why Brabantio’s reaction is so bitter.","rev":"Welcome for a guest; rage for a son-in-law.","a":128,"b":128},{"id":"n54","ph":"Still question’d me the story of my life","title":"The story begins with Brabantio’s own request","tags":["voice","irony"],"meaning":"“Still” means constantly. Brabantio kept asking Othello to tell his story.","effect":"Brabantio set the courtship in motion by asking for the stories. Othello’s whole case is that the “magic” was Brabantio’s own invitation to listen. A neat reversal.","rev":"Brabantio started the story that won his daughter.","a":129,"b":129},{"id":"n55","ph":"sold to slavery","title":"A past of capture and sale","tags":["voice","race","lang"],"meaning":"Othello mentions being taken by the enemy and sold into slavery before gaining his freedom (“redemption”).","effect":"He says this lightly in a list, but it shapes who he is: a man who was once owned by others. The “Of … Of …” structure (anaphora) lines up dangers one after another and lets the audience feel the weight of a life lived in constant risk. This history also explains his claim to be a “rude” speaker unaccustomed to drawing rooms.","rev":"Anaphora (“Of … Of …”); enslaved, freed: a history of risk.","a":132,"b":139},{"id":"n56","ph":"Anthropophagi","title":"Marvels for a Venetian audience","tags":["voice","race","ctx"],"meaning":"Anthropophagi are cannibals. “Men whose heads grow beneath their shoulders” come from old travellers’ tales.","effect":"Othello gives listeners the wonders they wanted. These were the marvels that Europeans associated with distant lands. He uses the exotic as a tool, which makes Othello a skilled storyteller, not a naive one. The audience sees how his otherness is both a fascination and a barrier.","ask":"Is Othello a performer here? Does that make him less honest?","rev":"He shapes his “otherness” into a story people want to hear.","a":140,"b":145},{"id":"n57","ph":"Devour up my discourse","title":"Desdemona’s appetite for the story","tags":["voice","pat","lang"],"meaning":"“Discourse” means talk or narrative. Desdemona listens “with a greedy ear”.","effect":"The hunger images (“greedy”, “devour”) are about words, not bodies. She is an active listener, not a passive prize. The contrast with Iago’s “beast with two backs” could not be sharper: love begins here in an ear.","rev":"Ear, not body: she is hungry for the story.","a":147,"b":150},{"id":"n58","ph":"a prayer of earnest heart","title":"She asks to hear it all","tags":["pat","voice"],"meaning":"Othello says Desdemona earnestly asked him to tell the whole story (“pilgrimage”).","effect":"She starts this step. Othello’s account gives her initiative that her father and Iago’s picture of her never allowed. “Pilgrimage” treats his life as a sacred journey, a respectful word.","rev":"She asks; she is not simply won.","a":152,"b":153},{"id":"n59","ph":"passing strange","title":"We hear Desdemona only through Othello","tags":["voice","pat","lang"],"meaning":"She calls the story “strange, passing strange” and “pitiful, wondrous pitiful”.","effect":"The repetition with intensifying words (“passing”, “wondrous”) shows deep response. But note the frame: we are not hearing her. Othello reports her words. Desdemona’s love has so far been told by men.","rev":"Reported speech: Desdemona is still voiceless.","a":159,"b":161},{"id":"n60","ph":"heaven had made her such a man","title":"A wish to be a man","tags":["pat","voice"],"meaning":"Desdemona wishes heaven had made her such a man.","effect":"The wish can be read as a desire to share such a life, as a sign that her own world allows her few adventures, or as a gentle hint that she loves him. Either way, it shows the limits placed on women’s lives in the play’s world.","ask":"What does the wish tell us about the freedom Desdemona has?","rev":"She wishes to share his kind of life; women’s limits.","a":162,"b":163},{"id":"n61","ph":"Upon this hint I spake","title":"She hints; he speaks","tags":["pat","voice"],"meaning":"Desdemona suggests that a friend who loved her should learn Othello’s story. Othello takes the hint.","effect":"Her courtship method is indirect and clever. In a world where a woman couldn’t propose, a hint is her only channel and it works. She is the wooer as much as the wooed, which supports her later statement.","rev":"Indirect wooing: women’s only channel.","a":166,"b":166},{"id":"n62","ph":"She loved me for the dangers I had pass’d","title":"Love as an exchange of story and pity","tags":["fam","lang","irony"],"meaning":"The lines mirror each other: she loved him for his dangers; he loved her for pitying them.","effect":"The balanced structure (chiasmus) makes the love look perfectly symmetrical. But note what it rests on: a story and a response of pity. A love built on a narrative can be undone by a different narrative, which is what Iago will do.","ask":"What might happen to a love based on a story if someone else starts telling a different story?","rev":"Chiasmus; a love based on narrative is vulnerable to rival narratives.","a":167,"b":168},{"id":"n63","ph":"This only is the witchcraft I have used","title":"The only magic is words","tags":["voice","race","lang"],"meaning":"Othello answers the charge of witchcraft by saying that his only spell is storytelling.","effect":"He redefines the word “witchcraft” and turns Brabantio’s accusation into a compliment to speech. The line quietly makes voice the play’s real power, and since Iago’s weapon is also speech, this foreshadows the struggle ahead.","rev":"“Witchcraft” = storytelling; voice is power.","a":169,"b":169},{"id":"n64","ph":"let her witness it","title":"Desdemona is called to testify","tags":["struct","pat","voice"],"meaning":"“Witness” means to give evidence.","effect":"Desdemona has been described and argued over for 170 lines, and has not spoken. The delay is structural: Shakespeare lets us hear many men on her before we hear her. Now the play turns to her.","rev":"170 lines before Desdemona speaks.","a":170,"b":170}],"lens":{"themes":"Voice & storytelling is central: the tale is Othello’s defence. Family & love: love grows from listening and pity. Race & otherness: his history as a captive and traveller makes him both a marvel and an outsider. Patriarchy: Desdemona shapes the courtship by hints.","form":"A single long verse paragraph in smooth, flowing blank verse. The enjambment (sentences running across line ends) makes it sound like a story told at length, and the rhythm only tightens in the last short lines (“Here comes the lady”). In contrast to Brabantio’s broken outbursts, the verse is controlled.","structure":"The speech is a story within the play, with its own beginning (invitation), middle (the travels, her response) and end (the hint and the answer). It delays Desdemona’s entry and moves the trial from accusation to evidence.","language":"Anaphora (“Of … Of …”), lists of danger and wonder, appetite imagery for words (greedy ear, devour), sound and hearing words, chiasmus (167–168) and the redefinition of “witchcraft”."},"chunks":[{"who":"Duke","g":"The Duke: “Say it, Othello.”","lines":[{"n":127,"t":"Say it, Othello.","sh":false,"k":"v"}],"n":127,"sh":false},{"who":"Othello","g":"Othello: “Her father loved me, invited me often, and kept asking about the story of my life, year by year: the battles, sieges and fortunes I had gone through.”","lines":[{"n":128,"t":"Her father loved me; oft invited me;","sh":false,"k":"v"},{"n":129,"t":"Still question’d me the story of my life,","sh":false,"k":"v"},{"n":130,"t":"From year to year, the battles, sieges, fortunes,","sh":false,"k":"v"},{"n":131,"t":"That I have passed.","sh":false,"k":"v"}],"n":128,"sh":false},{"who":"Othello","g":"“I told it from my boyhood to the moment he asked me to stop: disastrous chances, moving accidents by sea and land, narrow escapes in the breach, capture by the enemy and sale into slavery, my ransom, and what happened on my travels,”","lines":[{"n":132,"t":"I ran it through, even from my boyish days,","sh":false,"k":"v"},{"n":133,"t":"To the very moment that he bade me tell it;","sh":false,"k":"v"},{"n":134,"t":"Wherein I spake of most disastrous chances,","sh":false,"k":"v"},{"n":135,"t":"Of moving accidents by flood and field","sh":false,"k":"v"},{"n":136,"t":"Of hair-breadth scapes i’ the imminent deadly breach,","sh":false,"k":"v"},{"n":137,"t":"Of being taken by the insolent foe","sh":false,"k":"v"},{"n":138,"t":"And sold to slavery, of my redemption thence","sh":false,"k":"v"},{"n":139,"t":"And portance in my travels’ history:","sh":false,"k":"v"}],"n":132,"sh":false},{"who":"Othello","g":"“tales of vast caves and empty deserts, rough quarries, rocks and hills with peaks that touch heaven (I had to tell those), of cannibals who eat each other, and the Anthropophagi, and men whose heads”","lines":[{"n":140,"t":"Wherein of antres vast and deserts idle,","sh":false,"k":"v"},{"n":141,"t":"Rough quarries, rocks and hills whose heads touch heaven","sh":false,"k":"v"},{"n":142,"t":"It was my hint to speak,—such was the process;","sh":false,"k":"v"},{"n":143,"t":"And of the Cannibals that each other eat,","sh":false,"k":"v"},{"n":144,"t":"The Anthropophagi and men whose heads","sh":false,"k":"v"}],"n":140,"sh":false},{"who":"Othello","g":"“grow beneath their shoulders. Desdemona would listen to this seriously, but household duties kept calling her away. She would finish quickly and come back, and with a greedy ear devour my words.”","lines":[{"n":145,"t":"Do grow beneath their shoulders. This to hear","sh":false,"k":"v"},{"n":146,"t":"Would Desdemona seriously incline:","sh":false,"k":"v"},{"n":147,"t":"But still the house-affairs would draw her thence:","sh":false,"k":"v"},{"n":148,"t":"Which ever as she could with haste dispatch,","sh":false,"k":"v"},{"n":149,"t":"She’ld come again, and with a greedy ear","sh":false,"k":"v"},{"n":150,"t":"Devour up my discourse: which I observing,","sh":false,"k":"v"}],"n":145,"sh":false},{"who":"Othello","g":"“I saw this, took a convenient hour and found a way to draw out of her an earnest request that I tell her the whole story of my wanderings, of which she had heard parts but not in detail. I agreed, and often drew tears from her when I spoke of painful blows my youth had suffered.”","lines":[{"n":151,"t":"Took once a pliant hour, and found good means","sh":false,"k":"v"},{"n":152,"t":"To draw from her a prayer of earnest heart","sh":false,"k":"v"},{"n":153,"t":"That I would all my pilgrimage dilate,","sh":false,"k":"v"},{"n":154,"t":"Whereof by parcels she had something heard,","sh":false,"k":"v"},{"n":155,"t":"But not intentively: I did consent,","sh":false,"k":"v"},{"n":156,"t":"And often did beguile her of her tears,","sh":false,"k":"v"},{"n":157,"t":"When I did speak of some distressful stroke","sh":false,"k":"v"},{"n":158,"t":"That my youth suffer’d. My story being done,","sh":false,"k":"v"}],"n":151,"sh":false},{"who":"Othello","g":"“When the story ended, she gave me a world of sighs for my trouble. She swore it was strange, passing strange, pitiful, wondrously pitiful. She wished she hadn’t heard it, yet wished that heaven had made her such a man. She thanked me, and said that if I had a friend who loved her, I should only need to teach him how to tell my story, and that would woo her.”","lines":[{"n":159,"t":"She gave me for my pains a world of sighs:","sh":false,"k":"v"},{"n":160,"t":"She swore, in faith, ’twas strange, ’twas passing strange,","sh":false,"k":"v"},{"n":161,"t":"’Twas pitiful, ’twas wondrous pitiful:","sh":false,"k":"v"},{"n":162,"t":"She wish’d she had not heard it, yet she wish’d","sh":false,"k":"v"},{"n":163,"t":"That heaven had made her such a man: she thank’d me,","sh":false,"k":"v"},{"n":164,"t":"And bade me, if I had a friend that loved her,","sh":false,"k":"v"},{"n":165,"t":"I should but teach him how to tell my story.","sh":false,"k":"v"}],"n":159,"sh":false},{"who":"Othello","g":"“At this hint I spoke. She loved me for the dangers I had been through, and I loved her because she pitied them. That is the only witchcraft I have used. Here comes the lady: let her witness it.”","lines":[{"n":166,"t":"And that would woo her. Upon this hint I spake:","sh":false,"k":"v"},{"n":167,"t":"She loved me for the dangers I had pass’d,","sh":false,"k":"v"},{"n":168,"t":"And I loved her that she did pity them.","sh":false,"k":"v"},{"n":169,"t":"This only is the witchcraft I have used:","sh":false,"k":"v"},{"n":170,"t":"Here comes the lady; let her witness it.","sh":false,"k":"v"}],"n":166,"sh":false}],"range":[127,170]},{"id":"e9","lesson":3,"label":"Extract 9","scene":3,"title":"“I do perceive here a divided duty”","short":"1.3 Divided duty","sub":"Desdemona speaks for the first time. Read her argument slowly.","setup":"Brabantio asks Desdemona to say in front of everyone whom she owes obedience to.","task":"Underline the words in Desdemona’s speech that come from law, duty or ownership. Does she challenge or accept the idea that a woman belongs to a man?","notes":[{"id":"n65","ph":"Men do their broken weapons rather use","title":"The Duke’s practical wisdom","tags":["pow"],"meaning":"The Duke says that when you are faced with a damaged situation, men would rather use broken weapons than go bare-handed.","effect":"The Duke’s main concern is the Turkish threat. His proverb advises Brabantio to settle for what he can get. It reminds us that Venice will put the interests of the state before a father’s private grief.","rev":"The state’s needs come first.","a":173,"b":175},{"id":"n66","ph":"half the wooer","title":"Brabantio stakes everything on her answer","tags":["pat","voice"],"meaning":"If Desdemona admits she was “half the wooer” (equal partner in the courtship), Brabantio will accept the blame.","effect":"He is sure she will say she was coerced. His confidence rests on his picture of her as quiet and obedient. The scene is built to overturn that expectation.","rev":"His certainty about her is about to be disproved.","a":175,"b":177},{"id":"n67","ph":"Where most you owe obedience","title":"A leading question: duty as a debt","tags":["pat","lang"],"meaning":"He asks her to name the person she owes obedience to.","effect":"“Owe” makes duty a debt. The question assumes there is only one correct answer: him. It is rigged, and Desdemona’s reply will show that she has seen it.","rev":"“Owe”: duty as a debt.","a":179,"b":180},{"id":"n68","ph":"I do perceive here a divided duty","title":"Her first words: a calm, exact argument","tags":["voice","pat"],"meaning":"Desdemona says her duty is divided between her father and her husband.","effect":"After 180 lines of being spoken about, her first words are not shy or tearful. They are precise. She doesn’t say she is disobeying; she says her obligations are two-fold. “Divided” is also the word that will define her later position.","ask":"Why might Shakespeare have her say “divided duty” rather than “I love him”?","rev":"First words: composed and exact; “divided”.","a":181,"b":181},{"id":"n69","ph":"you are the lord of duty","title":"Respect that cannot be quoted against her","tags":["pat","voice"],"meaning":"She acknowledges that she owes her father life and education and that he is the “lord of duty”.","effect":"By granting everything he is owed, she leaves him with nothing to object to. This courtesy makes the next step possible and is a skilful use of the language of patriarchy.","rev":"She accepts his authority fully, then limits it.","a":182,"b":184},{"id":"n70","ph":"I am hitherto your daughter: but here’s my husband","title":"“But”: the turn in the speech","tags":["pat","voice","lang"],"meaning":"“Hitherto” means until now. She is saying she was his daughter up to this point; now there is a husband.","effect":"One small word, “but”, swings the argument. She isn’t rejecting the idea that a woman’s duty goes to a man; she is moving it from one man to another. That is both a limit on her freedom and a real act of choice: she picks the man.","ask":"Does Desdemona challenge patriarchy here, or work within it? Can it be both?","rev":"Her duty moves from father to husband: she accepts the system but chooses within it.","a":185,"b":185},{"id":"n71","ph":"preferring you before her father","title":"She uses his own logic against him","tags":["voice","fam","pat"],"meaning":"She points out that her mother put her husband (Brabantio) before her own father.","effect":"This is argument by precedent and it can’t be refuted. Brabantio’s own marriage depended on the same choice. She speaks with the ease of a trained debater.","rev":"Argument by precedent: her mother did the same.","a":186,"b":188},{"id":"n72","ph":"So much I challenge","title":"A verb of rights","tags":["voice","lang"],"meaning":"“Challenge” here means claim by right.","effect":"This is a legal verb. Desdemona claims the right as a matter of principle, not as a favour. She is no longer a subject of discussion; she is an advocate.","rev":"“Challenge”: she claims a right.","a":188,"b":188},{"id":"n73","ph":"I had rather to adopt a child than get it","title":"Disowning a daughter","tags":["fam","pat"],"meaning":"Brabantio says he would rather adopt a child (choose one) than beget one (and be disobeyed).","effect":"He wishes he could have chosen a child to suit him. It shows the conditional nature of his love: a daughter who obeys is loved, one who chooses is rejected.","rev":"Love conditional on obedience.","a":191,"b":191},{"id":"n74","ph":"with all my heart","title":"A repeated phrase says opposite things","tags":["pat","lang"],"meaning":"He says he gives Othello what he would keep from him “with all my heart” if Othello didn’t already have it.","effect":"The same phrase is repeated and means two opposite things. The sentence is a bitter way of letting go while refusing to approve. Desdemona is described as something to be given or withheld.","rev":"Repetition shows bitterness; a daughter “given”.","a":193,"b":194},{"id":"n75","ph":"jewel","title":"“Jewel”: love and possession in one word","tags":["pat","fam","lang"],"meaning":"Brabantio calls Desdemona “jewel”.","effect":"A jewel is precious and also a possession. The word is affectionate and acquisitive. It links to the money and treasure words around her in Act 1 (bags, stow’d, guardage).","rev":"“Jewel”: precious, but an object.","a":195,"b":195},{"id":"n76","ph":"To hang clogs on them","title":"“Escape”, “tyranny”, “clogs”","tags":["pat","lang"],"meaning":"A “clog” is a block of wood tied to an animal’s leg to stop it straying.","effect":"Brabantio calls her departure an “escape”, which means he thought of her as confined. He says that he would become a tyrant to any other child. It is an unintentional admission of how he saw family life: as control.","rev":"Escape, tyranny, clogs: home as a place of control.","a":197,"b":198}],"lens":{"themes":"Patriarchy & agency: Desdemona negotiates the patriarchal system and chooses a husband. Voice: her first speech. Family & love: Brabantio’s conditional affection. Power: the Duke’s priorities.","form":"Desdemona’s speech is composed, regular blank verse with balanced clauses; Brabantio’s final lines are clipped and bitter, closing with “I have done”. The shared line at 175 and 180 passes the speech from father to daughter in a line, as if he hands her the floor.","structure":"The scene’s central moment arrives about 180 lines into the scene: father’s question, daughter’s answer, father’s response. It reverses the expectation set up in 1.1 and 1.2 that she is a passive object. The word “divided” also looks ahead to later conflicts.","language":"Legal and contractual diction (duty, bound, owe, challenge, due), antithesis (father/husband, hitherto/but), possessive terms (jewel, child, clogs), formal address (My noble father), and the pivot word “but”."},"chunks":[{"who":"Duke","g":"The Duke tells Brabantio to make the best of a broken situation: men would rather use broken weapons than their bare hands.","lines":[{"n":173,"t":"Take up this mangled matter at the best:","sh":false,"k":"v"},{"n":174,"t":"Men do their broken weapons rather use","sh":false,"k":"v"},{"n":175,"t":"Than their bare hands.","sh":false,"k":"v"}],"n":173,"sh":false},{"who":"Brabantio","g":"Brabantio: “Please hear her speak. If she admits she was half the wooer, may destruction fall on me if I blame the man. Come here, gentle mistress: in all this company, who do you think you owe most obedience to?”","lines":[{"n":175,"t":"I pray you, hear her speak:","sh":true,"k":"v"},{"n":176,"t":"If she confess that she was half the wooer,","sh":false,"k":"v"},{"n":177,"t":"Destruction on my head, if my bad blame","sh":false,"k":"v"},{"n":178,"t":"Light on the man! Come hither, gentle mistress:","sh":false,"k":"v"},{"n":179,"t":"Do you perceive in all this noble company","sh":false,"k":"v"},{"n":180,"t":"Where most you owe obedience?","sh":false,"k":"v"}],"n":175,"sh":true},{"who":"Desdemona","g":"Desdemona: “My noble father, I see here a divided duty. I am tied to you by life and upbringing; both teach me to respect you, and you are the lord of my duty.”","lines":[{"n":180,"t":"My noble father,","sh":true,"k":"v"},{"n":181,"t":"I do perceive here a divided duty:","sh":false,"k":"v"},{"n":182,"t":"To you I am bound for life and education;","sh":false,"k":"v"},{"n":183,"t":"My life and education both do learn me","sh":false,"k":"v"},{"n":184,"t":"How to respect you; you are the lord of duty;","sh":false,"k":"v"}],"n":180,"sh":true},{"who":"Desdemona","g":"“I am your daughter until now. But here is my husband, and the same duty my mother showed you, putting you before her own father, I claim the right to give to the Moor, my lord.”","lines":[{"n":185,"t":"I am hitherto your daughter: but here’s my husband,","sh":false,"k":"v"},{"n":186,"t":"And so much duty as my mother show’d","sh":false,"k":"v"},{"n":187,"t":"To you, preferring you before her father,","sh":false,"k":"v"},{"n":188,"t":"So much I challenge that I may profess","sh":false,"k":"v"},{"n":189,"t":"Due to the Moor my lord.","sh":false,"k":"v"}],"n":185,"sh":false},{"who":"Brabantio","g":"Brabantio: “God be with you. I’m finished. Please, your Grace, on to state business. I would rather adopt a child than father one.”","lines":[{"n":189,"t":"God be wi’ you! I have done.","sh":true,"k":"v"},{"n":190,"t":"Please it your grace, on to the state-affairs:","sh":false,"k":"v"},{"n":191,"t":"I had rather to adopt a child than get it.","sh":false,"k":"v"}],"n":189,"sh":true},{"who":"Brabantio","g":"“Come here, Moor. I give you, with all my heart, what I would, if you did not already have it, keep from you with all my heart. For your sake, jewel, I’m glad I have no other child: your escape would teach me to be a tyrant and fasten blocks on them. I’ve said my piece, my lord.”","lines":[{"n":192,"t":"Come hither, Moor:","sh":false,"k":"v"},{"n":193,"t":"I here do give thee that with all my heart","sh":false,"k":"v"},{"n":194,"t":"Which, but thou hast already, with all my heart","sh":false,"k":"v"},{"n":195,"t":"I would keep from thee. For your sake, jewel,","sh":false,"k":"v"},{"n":196,"t":"I am glad at soul I have no other child:","sh":false,"k":"v"},{"n":197,"t":"For thy escape would teach me tyranny,","sh":false,"k":"v"},{"n":198,"t":"To hang clogs on them. I have done, my lord.","sh":false,"k":"v"}],"n":192,"sh":false}],"range":[173,198]},{"id":"e10","lesson":3,"label":"Extract 10","scene":3,"title":"“Look to her, Moor” / “Honest Iago”","short":"1.3 The warning","sub":"Three rhyming couplets close the council. One of them will not leave the play.","setup":"The council ends. The Duke approves Othello’s plan to leave Desdemona in Iago’s care, then offers a farewell to Brabantio.","task":"Underline the three rhyming couplets and mark the rhyme words. What is each speaker trying to do with a rhyme?","notes":[{"id":"n77","ph":"far more fair than black","title":"Praise built on a colour code","tags":["race","form","lang"],"meaning":"“Fair” can mean beautiful, light-skinned and good. “Black” can mean dark-skinned, ugly and evil.","effect":"The Duke’s couplet sounds like a ruling and a compliment: Othello’s virtue makes him “fair”. But the logic only works if “black” is a defect that virtue can cancel. Even kindness is carrying the prejudice. The rhyme makes the saying memorable, as a proverb.","ask":"Can a sympathetic speaker still carry prejudice? How does the language show it?","rev":"A well-meant couplet that still equates black with bad.","a":290,"b":291},{"id":"n78","ph":"If virtue no delighted beauty lack","title":"Virtue as a kind of beauty","tags":["race","lang"],"meaning":"“Delighted” here means delightful. The Duke says that if goodness is a kind of beauty, Othello is fair.","effect":"The Duke argues by redefinition: a good man is beautiful. This is a generous gesture that still accepts that beauty is the standard. It ends a hearing in which no one has questioned the language of colour.","rev":"Virtue redefines beauty, but beauty remains the measure.","a":290,"b":290},{"id":"n79","ph":"use Desdemona well","title":"“Brave Moor”, “use … well”","tags":["pat","race"],"meaning":"“Use” means treat. The Senator calls Othello “brave Moor”.","effect":"Even in friendly farewells, the label “Moor” sticks. And “use” is a verb for things, so a woman is spoken of as something to be handled well. Small words, large cumulative effect.","rev":"Label “Moor” persists; “use” treats her as an object.","a":292,"b":292},{"id":"n80","ph":"if thou hast eyes to see","title":"Brabantio’s curse becomes Iago’s plan","tags":["dec","fam","irony","lang"],"meaning":"“Look to her” means watch her. “Eyes to see” asks if Othello can see the truth.","effect":"Brabantio plants a seed of suspicion in a rhyming couplet, so it is easy to remember. He calls Desdemona a deceiver using the rhyme of “see” and “thee”. Iago later uses the same logic, and sight becomes a theme: Othello will see too much and too little.","ask":"Why is a rhyming couplet an effective way to plant a thought?","rev":"A curse that will be echoed in Act 3 (“eyes”, “deceive”).","stretch":"Find where Othello recalls this warning in Act 3.","a":293,"b":294},{"id":"n81","ph":"My life upon her faith","title":"A wager that will be called in","tags":["dec","irony"],"meaning":"Othello stakes his life on Desdemona’s faithfulness. “Faith” means loyalty.","effect":"He answers Brabantio with absolute confidence. The audience, with Iago’s plan in mind, hears the line as a bet he is going to lose.","rev":"“My life upon her faith”: tragic irony.","a":295,"b":295},{"id":"n82","ph":"Honest Iago","title":"The label that sticks","tags":["dec","irony","lang"],"meaning":"“Honest” means truthful and trustworthy.","effect":"This is one of the first times Othello calls Iago “honest”. Iago will be called honest again and again. Every use adds to the irony because the audience knows the truth. The word is attached directly to a man we know to be dishonest.","rev":"“Honest Iago”: key word, repeated irony.","a":295,"b":295},{"id":"n83","ph":"My Desdemona must I leave to thee","title":"Handing her over","tags":["dec","pat","irony"],"meaning":"Othello puts Desdemona’s safety into Iago’s hands.","effect":"Structurally, the hero gives the villain access to his wife just after Brabantio’s warning. “My Desdemona” and “leave to thee” again treat her as someone to be placed in someone’s care. The audience is left in suspense.","rev":"The victim placed in the villain’s hands.","a":296,"b":296}],"lens":{"themes":"Race & otherness: the Duke’s “fair than black” and the persistent label “Moor”. Deception: “Honest Iago” and Brabantio’s warning. Family & love: a father’s curse. Patriarchy: Desdemona is left in a man’s care, then another’s.","form":"A run of rhyming couplets (290–291, 293–294) gives these lines the sound of final judgments and proverbs. Rhyme tends to close scenes in Shakespeare, and here it also gives Brabantio’s curse a lasting, quotable shape.","structure":"A chain of last words, each passing Desdemona on: the Duke blesses, the Senator instructs, Brabantio curses and Othello entrusts her to Iago. It leads directly into the end-of-act soliloquy.","language":"Moral colour code (fair/black), sight imagery (eyes to see), fidelity words (faith, honest, deceived), and verbs of treatment (use, leave)."},"chunks":[{"who":"Othello","g":"Othello finishes his request: Desdemona should be sent after him by his ancient, whom he trusts.","lines":[{"n":288,"t":"To be sent after me.","sh":false,"k":"v"}],"n":288,"sh":false},{"who":"Duke","g":"The Duke agrees. He says goodnight to everyone, then turns to Brabantio:","lines":[{"n":288,"t":"Let it be so.","sh":true,"k":"v"},{"n":289,"t":"Good night to every one.","sh":false,"k":"v"},{"n":289,"t":"And, noble signior,","sh":true,"k":"v"}],"n":288,"sh":true},{"who":"Duke","g":"“If virtue lacks no delightful beauty, your son-in-law is far more fair than black.”","lines":[{"n":290,"t":"If virtue no delighted beauty lack,","sh":false,"k":"c"},{"n":291,"t":"Your son-in-law is far more fair than black.","sh":false,"k":"c"}],"n":290,"sh":false},{"who":"First Senator","g":"The First Senator: “Farewell, brave Moor. Treat Desdemona well.”","lines":[{"n":292,"t":"Adieu, brave Moor, use Desdemona well.","sh":false,"k":"v"}],"n":292,"sh":false},{"who":"Brabantio","g":"Brabantio, to Othello: “Look to her, Moor, if you have eyes to see. She has deceived her father and may deceive you.”","lines":[{"n":293,"t":"Look to her, Moor, if thou hast eyes to see:","sh":false,"k":"c"},{"n":294,"t":"She has deceived her father, and may thee.","sh":false,"k":"c"}],"n":293,"sh":false},{"who":"Othello","g":"Othello: “I stake my life on her faith! Honest Iago, I must leave my Desdemona with you.”","lines":[{"n":295,"t":"My life upon her faith! Honest Iago,","sh":false,"k":"v"},{"n":296,"t":"My Desdemona must I leave to thee:","sh":false,"k":"v"}],"n":295,"sh":false},{"who":"Othello","g":"“Please let your wife attend her, and bring them after me as soon as is convenient.”","lines":[{"n":297,"t":"I prithee, let thy wife attend on her:","sh":false,"k":"v"},{"n":298,"t":"And bring them after in the best advantage.","sh":false,"k":"v"}],"n":297,"sh":false}],"range":[288,298]},{"id":"e11","lesson":3,"label":"Extract 11","scene":3,"title":"“Hell and night must bring this monstrous birth to the world’s light”","short":"1.3 Soliloquy","sub":"Alone on stage, Iago works out his plan. Listen for how it is invented.","setup":"Othello, Desdemona and the senators have left. Iago has just persuaded Roderigo to sell his land and bring money.","task":"List every motive Iago gives for hating Othello. Do they add up? Mark any word that comes from money, sight or animals.","notes":[{"id":"n84","ph":"make my fool my purse","title":"Roderigo as a bank","tags":["dec","lang","pow"],"meaning":"Iago uses Roderigo, a fool, as a purse (source of money).","effect":"The soliloquy begins with a person reduced to a bag of coins. The “fool” and “purse” are joined in a single phrase. The money images from 1.1 return, and we see a man who treats everyone as a resource.","rev":"People as purses: money imagery returns.","a":386,"b":386},{"id":"n85","ph":"I hate the Moor","title":"Motive hunting: sport, profit, hate","tags":["dec","ctx","race"],"meaning":"Iago says he uses Roderigo for sport and profit and then states that he hates the Moor.","effect":"“The Moor” is again the label. Iago offers hatred first and then reasons. The famous critic Coleridge called this “the motive-hunting of a motiveless malignity”; decide whether Iago’s reasons add up or whether he is searching for excuses.","ask":"Which of Iago’s motives is the most convincing? Does the number of motives make him more or less believable?","rev":"Several motives; hatred first. “Motiveless malignity” (Coleridge).","a":389,"b":389},{"id":"n86","ph":"it is thought abroad","title":"A rumour as a motive","tags":["dec","pat"],"meaning":"Iago says people think Othello has slept with his wife, Emilia (“done my office”).","effect":"He gives no evidence; it is “thought abroad”, which means rumour. A man who plans to destroy another with a rumour is moved by one. Emilia is not heard here: a woman as the site of a man’s dishonour.","rev":"Rumour as motive; Emilia is an unspoken property.","a":390,"b":391},{"id":"n87","ph":"Will do as if for surety","title":"Suspicion treated as certainty","tags":["dec","irony","struct"],"meaning":"“Surety” means certainty. Iago will act as if suspicion were fact.","effect":"This is the logic of the play in miniature. The audience watches Iago treating a suspicion as truth and later watches Othello do the same. The pattern links the villain’s method to the hero’s fall.","rev":"Suspicion acted on as truth: Iago’s logic, later Othello’s.","a":392,"b":393},{"id":"n88","ph":"He holds me well","title":"Othello’s trust is the lever","tags":["dec","irony"],"meaning":"Othello has a good opinion of Iago.","effect":"Iago builds his plan on Othello’s trust, which is a virtue. That’s the cruelty of the plot: its best material is the hero’s goodness.","rev":"Trust as a weakness to exploit.","a":393,"b":393},{"id":"n89","ph":"How, how? Let’s see","title":"Thinking aloud: the plan is invented live","tags":["struct","form","dec"],"meaning":"Iago works out his plan as he speaks.","effect":"The broken line and repeated “How, how?” show a mind improvising. Villainy here is opportunistic, not pre-planned. The audience is invited into the process of invention, which makes us uneasily complicit.","rev":"The plan is improvised in front of us.","a":395,"b":397},{"id":"n90","ph":"abuse Othello’s ear","title":"The ear: love’s instrument becomes a weapon","tags":["voice","irony","struct"],"meaning":"“Abuse” means to deceive or mistreat. The target is Othello’s ear.","effect":"Desdemona fell in love through her ear (1.3.149–150, “a greedy ear / Devour up my discourse”). Iago will destroy the marriage through Othello’s ear. The same organ, the same medium of words, is used for love and for hate.","ask":"How does this link back to Othello’s “witchcraft” speech?","rev":"Ear: love by story, ruin by story.","a":398,"b":398},{"id":"n91","ph":"framed to make women false","title":"A cynical view of women","tags":["pat","dec"],"meaning":"Iago says Cassio is built to make women unfaithful.","effect":"In Iago’s mind, women are easily led, so a good-looking man is a risk. The line reveals his contempt for women and plans to use that contempt to turn Othello against Desdemona.","rev":"Iago’s contempt for women.","a":400,"b":401},{"id":"n92","ph":"led by the nose","title":"Openness read as weakness","tags":["dec","lang","struct"],"meaning":"Iago says Othello is open and honest and so easy to lead, like an animal with a ring in its nose.","effect":"“Seem” echoes “seeming” (1.1.60). The animal image of the ass echoes “master’s ass” (1.1.47). Iago reads Othello’s best qualities as faults. The simile also puts Othello in the animal world where he has been placed from the first scene.","rev":"“Seem”, “asses”: callbacks to 1.1; virtue read as weakness.","a":402,"b":405},{"id":"n93","ph":"monstrous birth","title":"Evil imagined as a birth","tags":["form","lang","struct"],"meaning":"Iago’s plan is a “monstrous birth”, conceived in hell and night and brought to light.","effect":"The rhyming couplet ends the act on a note of completion. The birth image makes the plan something that will grow. Night and light echo Act 1’s shift from darkness to the lit council chamber, now corrupted. We leave the act with the villain, not the lovers.","rev":"Couplet ends the act; plan as a monstrous birth.","a":406,"b":407}],"lens":{"themes":"Deception: we see the plan from inside. Voice: the ear as weapon. Power: Iago manipulates through money, rumour and trust. Family & love: a husband’s jealousy about Emilia. Patriarchy: women as the sites of male honour.","form":"A soliloquy in blank verse, with broken lines and pauses where Iago thinks (“How, how? Let’s see”). The final lines form a rhyming couplet that closes the act. The scene begins in prose for the exchange with Roderigo.","structure":"The soliloquy resolves Act 1’s exposition and aims the action at Cyprus. It is the audience’s privileged access to the villain. Ending the act on Iago, not on the couple, shapes how we read everything in Acts 2 and 3.","language":"Money and trade (fool, purse, profit, sheets as a ledger of honour), animal imagery (ass), sight and ear words, seem/honest, and birth and hell imagery (engender’d, monstrous birth, hell and night)."},"chunks":[{"who":"Iago","g":"Iago to Roderigo: “Go on, goodbye. Make sure you have enough money in your purse.”","lines":[{"n":383,"t":"Go to; farewell. Put money enough in your","sh":false,"k":"p"},{"n":384,"t":"purse.","sh":false,"k":"p"}],"n":383,"sh":false},{"who":"Roderigo","g":"Roderigo: “I’ll go and sell all my land.”","lines":[{"n":385,"t":"I’ll go sell all my land.","sh":false,"k":"p"}],"n":385,"sh":false},{"who":"Iago","g":"Iago, alone: “That is how I always make a fool pay for me. I’d waste my hard-earned knowledge if I spent time on a fool like that except for sport and profit. I hate the Moor,”","lines":[{"n":386,"t":"Thus do I ever make my fool my purse:","sh":false,"k":"v"},{"n":387,"t":"For I mine own gain’d knowledge should profane,","sh":false,"k":"v"},{"n":388,"t":"If I would time expend with such a snipe","sh":false,"k":"v"},{"n":389,"t":"But for my sport and profit. I hate the Moor:","sh":false,"k":"v"}],"n":386,"sh":false},{"who":"Iago","g":"“and people say that between my sheets he has done my job. I don’t know if it’s true, but on mere suspicion I’ll act as if it were certain. He thinks well of me, so my plan will work better.”","lines":[{"n":390,"t":"And it is thought abroad, that ’twixt my sheets","sh":false,"k":"v"},{"n":391,"t":"He has done my office: I know not if’t be true;","sh":false,"k":"v"},{"n":392,"t":"But I, for mere suspicion in that kind,","sh":false,"k":"v"},{"n":393,"t":"Will do as if for surety. He holds me well;","sh":false,"k":"v"},{"n":394,"t":"The better shall my purpose work on him.","sh":false,"k":"v"}],"n":390,"sh":false},{"who":"Iago","g":"“Cassio is a handsome man. Let me think: to get his place and feed my will with a double villainy. How? How? Let me see. After some time, I’ll abuse Othello’s ear by telling him that Cassio is too friendly with his wife.”","lines":[{"n":395,"t":"Cassio’s a proper man: let me see now:","sh":false,"k":"v"},{"n":396,"t":"To get his place and to plume up my will","sh":false,"k":"v"},{"n":397,"t":"In double knavery—How, how? Let’s see:—","sh":false,"k":"v"},{"n":398,"t":"After some time, to abuse Othello’s ear","sh":false,"k":"v"},{"n":399,"t":"That he is too familiar with his wife.","sh":false,"k":"v"}],"n":395,"sh":false},{"who":"Iago","g":"“Cassio has the looks and the smooth manner to be suspected, made to make women unfaithful. The Moor has a free and open nature, thinks men honest if they only seem so, and will be led by the nose like an ass.”","lines":[{"n":400,"t":"He hath a person and a smooth dispose","sh":false,"k":"v"},{"n":401,"t":"To be suspected, framed to make women false.","sh":false,"k":"v"},{"n":402,"t":"The Moor is of a free and open nature,","sh":false,"k":"v"},{"n":403,"t":"That thinks men honest that but seem to be so,","sh":false,"k":"v"},{"n":404,"t":"And will as tenderly be led by the nose","sh":false,"k":"v"},{"n":405,"t":"As asses are.","sh":false,"k":"v"}],"n":400,"sh":false},{"who":"Iago","g":"“I have it. It is conceived. Hell and night must bring this monstrous birth into the light of day.”","lines":[{"n":406,"t":"I have’t. It is engender’d. Hell and night","sh":false,"k":"c"},{"n":407,"t":"Must bring this monstrous birth to the world’s light.","sh":false,"k":"c"}],"n":406,"sh":false}],"range":[383,407]}],"themes":[{"id":"pat","blurb":"Women are discussed as property by men before they speak. Act 1 gives Desdemona a voice in 1.3, but her argument works inside a system where a woman’s duty passes from one man to another.","look":"Look for words of ownership (daughter, bags, jewel, guardage), lists that include women among goods, and moments where a woman’s choice is explained away as magic or theft.","beats":[{"s":"1.1","q":"Look to your house, your daughter and your bags!","ref":"1.1.80","note":"n16","e":"e3","say":"Desdemona is listed with a house and money."},{"s":"1.2","q":"the sooty bosom / Of such a thing as thou","ref":"1.2.70–71","note":"n39","e":"e6","say":"“Guardage” makes her a ward, and her choice is attributed to enchantment."},{"s":"1.3","q":"I am hitherto your daughter: but here’s my husband","ref":"1.3.185","note":"n70","e":"e9","say":"Desdemona speaks, argues and moves her duty to a husband she chose."},{"s":"1.3","q":"use Desdemona well","ref":"1.3.292","note":"n79","e":"e10","say":"She is passed to Othello’s care as an object to be handled, in a friendly farewell."}],"duffy":"If taught: poems from The World’s Wife where a woman answers the man who has defined her, for example “Mrs Midas”, “Little Red-Cap”, “Pygmalion’s Bride” or “Penelope”. Match to the poems you have actually studied before using them.","novels":"Context only this year: Woman at Point Zero shows a young woman treated as property by male relatives and later exploited. Purple Hibiscus shows a household ruled by a strict, religious father. Full analysis is in Year 2.","qs":["How does Shakespeare use language of ownership to present Desdemona before she speaks?","Does Desdemona challenge patriarchy in 1.3, or work within it? Use two moments.","Paper 2 style: In what ways do two texts show women defining themselves against the people who claim to own them?"]},{"id":"pow","blurb":"Act 1 is a study of who has authority and where it comes from. Brabantio has private authority as a father and senator. Othello has public authority because Venice needs him. Iago has none and works in secret.","look":"Look for who commands whom, who interrupts or controls the length of speech, and who gets the last word. Notice when the state’s needs override personal grievances.","beats":[{"s":"1.1","q":"Preferment goes by letter and affection","ref":"1.1.36","note":"n9","e":"e2","say":"Iago’s complaint that favour decides promotion."},{"s":"1.2","q":"Keep up your bright swords, for the dew will rust them","ref":"1.2.59","note":"n34","e":"e6","say":"Othello ends a fight with wit and composure."},{"s":"1.2","q":"Whose messengers are here about my side","ref":"1.2.89","note":"n43","e":"e6","say":"Othello uses the Duke’s need for him as protection."},{"s":"1.3","q":"thin habits and poor likelihoods","ref":"1.3.108","note":"n52","e":"e7","say":"The Duke demands evidence, so authority is tied to proof."}],"duffy":"If taught: poems where a figure wields or loses control, such as “Mrs Midas” or “Medusa”. Note how the speaker’s power changes when she tells her story.","novels":"Context only this year: both novels examine power inside the home and in society. Treat as plot-level context.","qs":["What is the source of Othello’s authority in Act 1, and what is its weakness?","How does Shakespeare show the difference between private and public power?","Paper 2 style: How do two texts show that power depends on who is allowed to tell the story?"]},{"id":"race","blurb":"Othello is a Black general in a white city, valued for what he does and held at a distance as a person. In 1.1 he is never named; he is “the Moor” and worse. In 1.3 even a sympathetic voice praises him with a colour code.","look":"Look for labels, animal and devil images, colour words (black, fair, sooty), and how the speaker’s language shows their prejudice rather than the truth about Othello.","beats":[{"s":"1.1","q":"an old black ram / Is topping your white ewe","ref":"1.1.88–89","note":"n18","e":"e3","say":"Prejudice turned into a sexual, animal image."},{"s":"1.2","q":"the sooty bosom / Of such a thing as thou","ref":"1.2.70–71","note":"n39","e":"e6","say":"Skin colour as dirt, and Othello as a “thing”."},{"s":"1.3","q":"what she fear’d to look on","ref":"1.3.98","note":"n50","e":"e7","say":"“What” instead of “whom”."},{"s":"1.3","q":"far more fair than black","ref":"1.3.291","note":"n77","e":"e10","say":"A compliment that still equates black with bad."}],"duffy":"This is the weakest link to Duffy and to Woman at Point Zero. A bridge: being defined by a label that others have chosen. Say so honestly when comparing.","novels":"Context only this year: Purple Hibiscus considers otherness through religion and class in Nigeria. Treat as plot-level context.","qs":["How does Shakespeare let the audience hear prejudice before it hears Othello?","Is the Duke’s couplet “far more fair than black” generous or limiting? Argue both sides.","Paper 2 style: How do two texts show a person being defined by a label?"]},{"id":"voice","blurb":"Who gets to speak, and in what form? Desdemona is silent for 180 lines. Othello’s defence is a story. Iago’s weapon is whispering. In Act 1, voice is a form of power and a form of risk.","look":"Look for the length of speeches, who is described before they speak, the difference between reported and direct speech, and words about hearing, telling and speech.","beats":[{"s":"1.3","q":"Rude am I in my speech","ref":"1.3.81","note":"n46","e":"e7","say":"Othello’s modest introduction to a masterly speech."},{"s":"1.3","q":"Devour up my discourse","ref":"1.3.150","note":"n57","e":"e8","say":"Desdemona’s appetite is for words."},{"s":"1.3","q":"This only is the witchcraft I have used","ref":"1.3.169","note":"n63","e":"e8","say":"The only magic is a story."},{"s":"1.3","q":"abuse Othello’s ear","ref":"1.3.398","note":"n90","e":"e11","say":"The ear becomes the target of Iago’s plan."}],"duffy":"If taught: Duffy’s monologues give a wife the voice that the myths denied her (for example “Mrs Midas” or “Anne Hathaway”). The dramatic monologue is the natural bridge.","novels":"Context only this year: in Woman at Point Zero Firdaus tells her story before her execution; in Purple Hibiscus Kambili is largely silent at first. Plot-level context only.","qs":["How does Shakespeare use storytelling as a defence in 1.3?","What is the effect of delaying Desdemona’s first words until line 180?","Paper 2 style: How do two texts present speaking as an act of survival or resistance?"]},{"id":"dec","blurb":"Appearance and reality collide from the first scene. Iago says he is not what he is; Othello says he must be found. The Duke demands evidence rather than “seeming”. The act ends with a plan to build a false picture in a trusting man’s ear.","look":"Look for the words seem, honest, show, look and see, clothing images, and moments when the audience knows more than the characters.","beats":[{"s":"1.1","q":"But seeming so, for my peculiar end","ref":"1.1.60","note":"n13","e":"e2","say":"Iago names his own method."},{"s":"1.1","q":"I am not what I am","ref":"1.1.65","note":"n15","e":"e2","say":"The play’s motto for deception."},{"s":"1.3","q":"Honest Iago","ref":"1.3.295","note":"n82","e":"e10","say":"The label that creates dramatic irony."},{"s":"1.3","q":"The Moor is of a free and open nature","ref":"1.3.402","note":"n92","e":"e11","say":"Iago reads honesty as weakness."}],"duffy":"If taught: poems where the speaker reveals what her husband refuses to admit; the reader sees through the mask. “Mrs Midas” and “Mrs Aesop” fit well.","novels":"Context only this year: Purple Hibiscus shows public goodness hiding private cruelty. Plot-level context only.","qs":["How does Iago explain his method in 1.1?","Why does Shakespeare let the audience see through Iago from the start?","Paper 2 style: How do two texts use irony to show the gap between how a person appears and who they are?"]},{"id":"fam","blurb":"Family is a source of love and of control. Brabantio loves Desdemona and cannot bear her choice. Desdemona and Othello’s love begins in an exchange of story and pity. Even the villain’s motive involves a marriage: Iago suspects his wife Emilia.","look":"Look for words of duty, obedience and debt (owe, bound, due), words for children and parents, and the difference between love as care and love as possession.","beats":[{"s":"1.1","q":"Who would be a father!","ref":"1.1.164","note":"n22","e":"e4","say":"Real grief that is also about his own role."},{"s":"1.3","q":"She loved me for the dangers I had pass’d","ref":"1.3.167","note":"n62","e":"e8","say":"A love founded on a story and on pity."},{"s":"1.3","q":"I had rather to adopt a child than get it","ref":"1.3.191","note":"n73","e":"e9","say":"A father’s love that depends on obedience."},{"s":"1.3","q":"Look to her, Moor","ref":"1.3.293","note":"n80","e":"e10","say":"A father’s curse that Iago will use."}],"duffy":"If taught: poems about marriage and family, such as “Demeter” (mother and daughter), “Anne Hathaway” (a love poem in a wife’s voice) or “Mrs Midas”.","novels":"Context only this year: both novels centre on families and the cost of obedience. Plot-level context only.","qs":["Is Brabantio’s love for Desdemona real? Use two moments.","What does the exchange “loved me for the dangers … loved her that she did pity them” tell us about the couple?","Paper 2 style: How do two texts show love changing when it is tested by duty?"]}],"guide":{"form":[{"h":"Blank verse","t":"Most of the play is in unrhymed iambic pentameter: a line of ten syllables with the stress on every second one (da-DUM, da-DUM …). It is close to natural English speech, which is why variations stand out.","eg":[{"r":"1.3.291","q":"Your son-in-law is far more fair than black.","n":"Ten syllables, five regular beats: your SON-in-LAW is FAR more FAIR than BLACK."}],"tryit":"Say the line aloud, tapping on the stresses. Which word gets the final stress, and why does that matter?"},{"h":"Irregular lines","t":"Extra syllables at the end (a feminine ending) or very short lines break the pattern. Breaks often mark thought, hesitation or emotion.","eg":[{"r":"1.3.402","q":"The Moor is of a free and open nature,","n":"Eleven syllables: an extra unstressed ending."},{"r":"1.1.15","q":"And, in conclusion,","n":"A short line that works as a pause before a sneer."}],"tryit":"Find another short line in Iago’s speeches. What does the pause do?"},{"h":"Verse and prose","t":"Prose is not a mistake. Shakespeare uses it for crude, comic, quick or intimate speech. The change in register can tell you about the speaker or the mood.","eg":[{"r":"1.1.108–117","q":"…you’ll have your daughter covered with a Barbary horse…","n":"Iago drops into prose for his coarsest lines."},{"r":"1.3.383–385","q":"Put money enough in your purse.","n":"Business-like prose between Iago and Roderigo before the soliloquy."}],"tryit":"Why might Iago use prose to Brabantio, but verse to Roderigo in 1.1.35–65?"},{"h":"Shared lines","t":"When two speakers complete a single ten-syllable line between them, the pace quickens. It can show agreement, interruption or one voice cutting across another.","eg":[{"r":"1.2.17","q":"Will give him cable. / Let him do his spite","n":"Othello cuts into Iago’s line with calm defiance."},{"r":"1.3.175","q":"Than their bare hands. / I pray you, hear her speak","n":"Brabantio takes over the Duke’s line to demand Desdemona’s answer."}],"tryit":"Where else in Act 1 does a character finish another’s line? What is the effect?"},{"h":"Rhyming couplets","t":"Pairs of rhymed lines tend to close speeches and scenes. They sound like verdicts, proverbs or spells.","eg":[{"r":"1.3.290–291","q":"If virtue no delighted beauty lack, / Your son-in-law is far more fair than black.","n":"The Duke’s verdict, built on a colour code."},{"r":"1.3.406–407","q":"Hell and night / Must bring this monstrous birth to the world’s light.","n":"Iago closes the act with a rhyming plan."}],"tryit":"What do the Duke’s couplet and Iago’s couplet have in common, and how do they differ
