?"},{"h":"Soliloquy","t":"A soliloquy is a character alone on stage speaking their thoughts to the audience. It is the main way the play shows private intention.","eg":[{"r":"1.3.386–407","q":"Thus do I ever make my fool my purse…","n":"The first full Iago soliloquy: motives, method and a birth image."}],"tryit":"What does the audience know after the soliloquy that no character on stage does?"}],"structure":[{"h":"In medias res","t":"The play starts in the middle of an argument. The audience has to catch up, which makes us listen closely and puts us on Iago’s side of the secret.","eg":[{"r":"1.1.1","q":"Tush! never tell me; I take it much unkindly","n":"The first line is a reply to something we have not heard."}],"tryit":"What effect does it have not to be told who these men are or why they are quarrelling?"},{"h":"From street to council chamber","t":"Act 1 moves from a dark street (1.1) to another street (1.2) to a lit council chamber (1.3). It is a movement from noise and rumour to order and speech.","eg":[{"r":"1.1–1.3","q":"Street → street → council chamber","n":"The action becomes more formal and public as it goes."}],"tryit":"Which of the three scenes feels most “public”, and what happens when private feeling enters it?"},{"h":"Delayed entrances","t":"Shakespeare keeps his main figures offstage. Othello first speaks in 1.2 after being talked about in 1.1. Desdemona’s first words come in 1.3 at line 180.","eg":[{"r":"1.3.170","q":"Here comes the lady; let her witness it.","n":"The delay is structural: she is spoken about before she speaks."}],"tryit":"What does the audience think of a character they have only heard others describe?"},{"h":"Two searches collide","t":"Brabantio hunts for Othello, and the Duke’s officers hunt for him as well. The two searches meet in 1.2, which turns a private quarrel into a matter of state.","eg":[{"r":"1.2.54–89","q":"Here comes another troop to seek for you.","n":"Two groups of searchers converge on one street."}],"tryit":"Why might the play make the state’s need and the father’s anger arrive together?"},{"h":"Mirrored speeches","t":"Iago’s “I am not what I am” in 1.1 and Othello’s promise of a “round unvarnish’d tale” in 1.3 are mirror opposites: concealment against openness.","eg":[{"r":"1.1.65","q":"I am not what I am.","n":"Concealment."},{"r":"1.3.90","q":"I will a round unvarnish’d tale deliver","n":"Openness."}],"tryit":"How does placing these two speeches in the same act prepare the tragedy?"},{"h":"Ending on Iago","t":"Act 1 ends with the villain’s rhyming couplet, not the couple’s victory. That sets the tone for everything that follows.","eg":[{"r":"1.3.406–407","q":"Hell and night / Must bring this monstrous birth to the world’s light.","n":"The act closes on the plan."}],"tryit":"What if the act had ended with the Duke’s couplet instead?"}],"language":[{"h":"Animal imagery","t":"People are repeatedly compared to animals: ram, ewe, horse, beast, ass, clogs on an animal’s leg. The pattern suggests a world in which people are classed and used.","eg":[{"r":"1.1.88–89","q":"an old black ram / Is topping your white ewe","n":"Othello and Desdemona as animals."},{"r":"1.3.404–405","q":"led by the nose / As asses are","n":"Othello as an animal, again."}],"tryit":"Turn on the Imagery lens and trace the animal words through Extract 3. Who uses them?"},{"h":"Money and trade","t":"Venice is a trading city and the language shows it: price, purse, bags, owe, due, worth. Even love is priced.","eg":[{"r":"1.1.11","q":"I know my price","n":"Iago values himself as goods."},{"r":"1.3.386","q":"make my fool my purse","n":"Roderigo as a bank."}],"tryit":"Find three money words in Desdemona’s speech (1.3.181–189). What do they suggest?"},{"h":"Sight and hearing","t":"Look, see, eyes, witness and seeming run alongside ear and discourse. Who sees clearly? Who is deceived by what he hears?","eg":[{"r":"1.3.293","q":"Look to her, Moor, if thou hast eyes to see","n":"A challenge to Othello’s sight."},{"r":"1.3.398","q":"abuse Othello’s ear","n":"The ear as the target."}],"tryit":"Why might a play about deception focus on eyes and ears?"},{"h":"Hell, devil and magic","t":"Characters explain what they cannot accept by calling it magic or devilry. This language says more about the speaker’s fear than about Othello.","eg":[{"r":"1.1.91","q":"the devil will make a grandsire of you","n":"Iago uses hell imagery as a weapon."},{"r":"1.3.102","q":"practices of cunning hell","n":"Brabantio’s circular argument."}],"tryit":"How does Othello redefine “witchcraft” in 1.3.169?"},{"h":"Rhetorical devices","t":"Anaphora (repeating the start of lines), antithesis (opposites), chiasmus (mirror structure), accumulation (lists) and litotes (understatement) give the speeches shape.","eg":[{"r":"1.3.134–139","q":"Of … Of … Of …","n":"Anaphora in Othello’s tale."},{"r":"1.3.167–168","q":"She loved me for the dangers I had pass’d, / And I loved her that she did pity them.","n":"Chiasmus."}],"tryit":"Pick one device and find a second example in Act 1."},{"h":"Key words","t":"A handful of words recur: honest, seem, duty, thief, fair, look. Use the word finder to see where each appears in Act 1.","eg":[],"tryit":"Open the word finder (Find in the top bar) and search “honest”. Who is called honest, and by whom?"}]},"img":{"animal":{"name":"Animals","words":["ram","ewe","horse","horses","coursers","gennets","beast","ass","asses","clogs","snipe","flies","daws"]},"money":{"name":"Money and trade","words":["price","purse","bags","profit","debitor","creditor","counter-caster","worth","owe","thief","thieves","robb’d","jewel","property","sold","redemption"]},"sight":{"name":"Sight and hearing","words":["eyes","eye","look","witness","seeming","seem","visages","demonstrate","manifest","overt","ear","discourse","hear","heard"]},"hell":{"name":"Hell and magic","words":["devil","damn’d","hell","charms","witchcraft","magic","enchanted","drugs","conjuration","conjured","minerals","mixtures","dram"]}},"gl":[   const rail=ids.map((id,i)=>{const [a,b]=stepLabel(S.lesson,id);const dn=S.done[S.lesson+':'+id];return `<button data-step="${id}" class="${dn?'done':''}" ${id===S.step?'aria-current="step"':''}><span class="tick">${dn?'✓':''}</span><span>${esc(a)}<small>${esc(b)}</small></span></button>`}).join('');
  return `<div class="page-h"><div class="eyebrow">${esc(L.title)} · ${esc(L.subtitle.split(':')[0])}</div><h1>${esc(L.subtitle.includes(':')?L.subtitle.split(':').slice(1).join(':').trim().replace(/^./,c=>c.toUpperCase()):L.subtitle)}</h1><div class="rule"></div></div>
  <div class="lesson"><div class="rail" role="tablist" aria-label="Lesson steps">${rail}</div><section class="step" id="stepbox">${stepView(L)}</section></div>`;
}
function nextPrev(L){
  const ids=stepIds(S.lesson), i=ids.indexOf(S.step);
  const p=i>0?ids[i-1]:null, n=i<ids.length-1?ids[i+1]:null;
  return `<div class="btnrow">${p?`<button class="btn ghost" data-step="${p}">← ${esc(stepLabel(S.lesson,p)[0])}</button>`:''}${n?`<button class="btn" data-step="${n}" data-mark="1">${esc(stepLabel(S.lesson,n)[0])} →</button>`:`<button class="btn acc" data-mark="1" data-finish="1">${S.lesson<3?'Go to Lesson '+(S.lesson+1):'Open Revise'} →</button>`}</div>`;
}
function stepView(L){
  const id=S.step;
  if(id==='aims')return aimsView(L)+nextPrev(L);
  if(id==='ctx')return ctxView(L)+nextPrev(L);
  if(id==='practice')return practiceView(L)+nextPrev(L);
  if(id==='exit')return exitView(L)+nextPrev(L);
  return extractView(EX[id])+linkAfter(L,id)+nextPrev(L);
}

  `<div class="card"><b class="eyebrow">Next</b><p style="margin-top:4px">${esc(x.next)}</p></div>`;

/* ---------- extract ---------- */
function lineHTML(e,c,l,idx){
  const here=e.notes.filter(n=>l.n>=n.a&&l.n<=n.b);
  // phrase marks: only first line that contains phrase
  const marks=[];
  e.notes.forEach(n=>{ if(n.ph&&n._line===undefined){ /* resolved lazily */ } });
  const pm=e.notes.filter(n=>n.ph&&n._ln===l);
  let html='',t=l.t;
  const segs=pm.map(n=>({n,s:t.indexOf(n.ph)})).filter(x=>x.s>=0).sort((a,b)=>a.s-b.s);
  let pos=0;
  segs.forEach(x=>{
    if(x.s<pos)return;
    html+=words(t.slice(pos,x.s));
    const cl=firstTheme(x.n), cls=['hl',colorClass(x.n)];
    if(S.theme){cls.push(x.n.tags.includes(S.theme)?'match':'dim')}
    html+=`<mark class="${cls.join(' ')}" data-n="${x.n.id}">${words(x.n.ph)}</mark>`+pinHTML(x.n);
    pos=x.s+x.n.ph.length;
  });
  html+=words(t.slice(pos));
  // pins for range notes without phrase on the last line
  e.notes.filter(n=>!n.ph&&n._pin===l).forEach(n=>{html+=pinHTML(n)});
  const rng=here.filter(n=>n.b>n.a);
  const rc=rng.length?`style="--rc:var(--t-${firstTheme(rng[0])||'dec'})"`:'';
  const cls=['ln',l.k,l.sh?'sh':'',rng.length?'rng':''].join(' ');
  const showNum=!l.sh&&(l.n%5===0);
  return `<div class="${cls}" data-ln="${l.n}" ${rc}><span class="num">${showNum?l.n:''}</span><span class="tx">${html}</span></div>`;
}
function pinHTML(n){const dim=S.theme&&!n.tags.includes(S.theme);return `<button class="pin ${colorClass(n)} ${dim?'dim':''}" data-n="${n.id}" aria-label="Open note: ${esc(n.title)}"><i></i></button>`}
function resolveNotes(e){
  if(e._res)return; e._res=1;
  const all=[];e.chunks.forEach(c=>{if(!c.gap)c.lines.forEach(l=>all.push(l))});
  e.notes.forEach(n=>{
    if(n.ph){n._ln=all.find(l=>l.n>=n.a&&l.n<=n.b&&l.t.includes(n.ph))}
    else{const cands=all.filter(l=>l.n===n.b);n._pin=cands[cands.length-1]||all.filter(l=>l.n>=n.a&&l.n<=n.b).pop()}
  });
}
function extractView(e){
  resolveNotes(e);
  const body=e.chunks.map((c,ci)=>{
    if(c.gap)return `<div class="stage" style="text-align:center">· · ·</div>`;
    const key=e.id+':'+ci, open=S.plain||S.open.has(key);
    return `<div class="chunk">${c.st?`<div class="stage">${esc(c.st)}</div>`:''}<div class="spk">${esc(c.who)}${c.g?`<button class="say" data-say="${key}" aria-expanded="${open}">plain English</button>`:''}</div>${c.lines.map(l=>lineHTML(e,c,l)).join('')}${c.g?`<div class="gloss" id="g-${e.id}-${ci}" ${open?'':'hidden'}><b>In plain English</b>${esc(c.g)}</div>`:''}</div>`;
  }).join('');
  const lens=['themes','form','structure','language'];
  const lt=S.lensTab||'themes';
  const nlist=e.notes.map(n=>{const dim=S.theme&&!n.tags.includes(S.theme);return `<button class="nrow ${dim?'dim':''}" data-n="${n.id}"><span class="dots">${n.tags.filter(t=>TAG[t].kind==='theme').map(t=>`<span class="dot t-${t}"></span>`).join('')||'<span class="dot"></span>'}</span><span>${esc(n.title)}</span><span class="ref">${n.a===n.b?e.scene?ref(e,n.a):'':ref(e,n.a)+'–'+n.b}</span></button>`}).join('');
  return `<div class="step-h"><div class="eyebrow">${esc(e.label)} · Act 1, Scene ${e.scene}</div><h2>${esc(e.title)}</h2><p>${esc(e.sub)}</p></div>
  <div class="card"><b class="eyebrow">Setting the scene</b><p style="margin:4px 0 0">${esc(e.setup)}</p></div>
  <div class="callout"><b>Task</b>${esc(e.task)}</div>
  <div class="script"><div class="script-head"><span class="eyebrow">Othello · Act 1, Scene ${e.scene}</span><span class="ref">lines ${ref(e,e.range[0])}–${e.range[1]}</span></div>
   <div class="formkey"><span>V verse</span><span style="color:var(--lagoon)">P prose</span><span style="color:var(--gilt)">⇄ rhyming couplet</span><span>┆ shared line (two speakers, one line)</span></div>
   <div class="imgkey">${Object.entries(D.img).map(([k,o])=>`<span class="im-${k}">${esc(o.name)}</span>`).join('')}</div>
   ${body}</div>
  <p class="tools-note">Tap an underlined phrase or a dot to open its note. Dotted words have a quick explanation. Use “plain English” under each speaker for a paraphrase.</p>
  <h3 style="margin:18px 0 8px">Look closer</h3>
  <div class="card"><div class="tabs" role="tablist">${lens.map(k=>`<button role="tab" data-lt="${k}" aria-selected="${lt===k}">${k[0].toUpperCase()+k.slice(1)}</button>`).join('')}</div><p style="margin:0" id="lenstext">${esc(e.lens[lt])}</p></div>
  <h3 style="margin:18px 0 8px">Notes in this extract <span class="tools-note">(${e.notes.length})</span></h3><div class="nlist">${nlist}</div>`;
}

function lineOf(n){const e=EX[n.ex];resolveNotes(e);return n._ln?n._ln.t:n.ph}

  <h3 style="margin:22px 0 8px">All ${notes.length} notes on this theme</h3>

/* ---------- revise ---------- */
function reviseView(){
  const tabs=[['notes','Notes'],['quotes','Quotation bank'],['quiz','Quiz']];
  const rated=Object.keys(S.rate).length, total=Object.keys(NOTE).length;
  let body='';
  if(S.rv.tab==='notes'){
    const th=D.tags.filter(t=>t.kind==='theme');
    const list=Object.values(NOTE).filter(n=>(!S.rv.theme||n.tags.includes(S.rv.theme))&&(S.rv.rate==='all'||(S.rv.rate==='none'?!S.rate[n.id]:String(S.rate[n.id])===S.rv.rate)));
    body=`<div class="lensbar" style="padding-top:0"><span class="lab">Theme</span><button class="chip" data-rvt="" aria-pressed="${!S.rv.theme}">All</button>${th.map(t=>`<button class="chip t-${t.id}" data-rvt="${t.id}" aria-pressed="${S.rv.theme===t.id}"><span class="dot"></span>${esc(t.name)}</button>`).join('')}</div>
    <div class="lensbar" style="padding-top:0"><span class="lab">My rating</span>${[['all','All'],['none','Not rated'],['1','Revisit'],['2','Unsure'],['3','Got it']].map(([k,l])=>`<button class="chip" data-rvr="${k}" aria-pressed="${S.rv.rate===k}">${l}</button>`).join('')}</div>
    <div class="nlist" style="margin-top:8px">${list.map(n=>`<button class="nrow" data-gonote="${n.id}"><span class="dots">${n.tags.filter(t=>TAG[t].kind==='theme').map(t=>`<span class="dot t-${t}"></span>`).join('')||'<span class="dot"></span>'}</span><span>${esc(n.title)}<br><span class="tools-note">${esc(n.rev)}</span></span><span class="ref">${ref(EX[n.ex],n.a)}${S.rate[n.id]?' · '+['','Revisit','Unsure','Got it'][S.rate[n.id]]:''}</span></button>`).join('')||'<p class="tools-note">No notes match.</p>'}</div>`;
  } else if(S.rv.tab==='quotes'){
    const qs=Object.values(NOTE).filter(n=>n.ph); const c=qs[S.card.i%qs.length];
    body=`<p class="tools-note">${qs.length} quotations. Say what the quotation shows, then tap the card to check.</p>
    <button class="quote-card t-${firstTheme(c)||'ctx'}" data-flip="1">${S.card.flip?`<div class="back"><b>${esc(c.title)}</b><p style="margin:4px 0">${esc(c.rev)}</p><div class="pillrow">${c.tags.map(t=>`<span class="tag ${TAG[t].kind==='tech'?'tech':'t-'+t}"><span class="dot"></span>${esc(TAG[t].name)}</span>`).join('')}</div></div>`:`<q>${esc(lineOf(c))}</q><span class="tools-note">${ref(EX[c.ex],c.a)}${c.b>c.a?'–'+c.b:''}</span>`}</button>
    <div class="btnrow"><button class="btn ghost" data-card="-1">← Previous</button><span class="tools-note" style="align-self:center">${S.card.i%qs.length+1} of ${qs.length}</span><button class="btn" data-card="1">Next →</button><button class="btn ghost" data-card="r">Shuffle</button><button class="link" data-gonote="${c.id}">Open note</button></div>`;
  } else {
    const q=D.quiz[S.qz.i];
    if(S.qz.done){ body=`<div class="card"><h3>${S.qz.score} out of ${D.quiz.length}</h3><p>${S.qz.score>=10?'Strong. Move to the Paper 2 comparisons on the theme pages.':S.qz.score>=7?'Good. Re-read the notes you rated Revisit.':'Go back through the notes by theme, then try again.'}</p><div class="btnrow"><button class="btn" data-qz="reset">Try again</button></div></div>`; }
    else body=`<div class="meter" aria-hidden="true"><i style="width:${S.qz.i/D.quiz.length*100}%"></i></div><p class="tools-note" style="margin-top:6px">Question ${S.qz.i+1} of ${D.quiz.length}</p><h3 style="margin:6px 0 12px;font-size:1.4rem">${esc(q.q)}</h3>
    ${q.opts.map((o,i)=>`<button class="qopt ${S.qz.ans!=null?(i===q.c?'ok':(i===S.qz.ans?'no':'')):''}" data-qa="${i}" ${S.qz.ans!=null?'disabled':''}>${esc(o)}</button>`).join('')}
    ${S.qz.ans!=null?`<div class="card"><b class="eyebrow">${S.qz.ans===q.c?'Correct':'Not quite'}</b><p style="margin:4px 0 0">${esc(q.why)}</p></div><div class="btnrow"><button class="btn" data-qz="next">${S.qz.i<D.quiz.length-1?'Next question →':'See score'}</button></div>`:''}`;
  }
  return `<div class="page-h"><div class="eyebrow">Revise Act 1</div><h1>Revision</h1><div class="rule"></div><p>You have rated ${rated} of ${total} notes. Ratings are saved on this device.</p></div>
  <div class="tabs" role="tablist">${tabs.map(([k,l])=>`<button role="tab" data-rt="${k}" aria-selected="${S.rv.tab===k}">${l}</button>`).join('')}</div>${body}`;
}

/* ---------- drawer ---------- */
function openDrawer(mode,id){
  S.drawer={mode,id}; const d=$('#drawer'); d.classList.add('open'); d.setAttribute('aria-hidden','false');
  document.body.classList.add('drawer-open'); $('#scrim').classList.add('on'); drawerBody(); markOn();
}
function closeDrawer(){ S.drawer=null; const d=$('#drawer'); d.classList.remove('open'); d.setAttribute('aria-hidden','true'); document.body.classList.remove('drawer-open'); $('#scrim').classList.remove('on'); markOn(); }
function drawerBody(){
  const b=$('#dbody'), t=$('#dtitle'); if(!S.drawer)return;
  if(S.drawer.mode==='note'){
    const n=NOTE[S.drawer.id], e=EX[n.ex]; t.textContent='Note · '+e.label;
    const list=e.notes, i=list.indexOf(n);
    const rt=S.rate[n.id]||0;
    const q=n.ph?n.ph:'';
    b.innerHTML=`<div class="${colorClass(n)}"><h3>${esc(n.title)}</h3>
    <div class="pillrow" style="margin-bottom:6px">${n.tags.map(x=>`<button class="tag ${TAG[x].kind==='tech'?'tech':'t-'+x}" data-tagf="${x}"><span class="dot"></span>${esc(TAG[x].name)}</button>`).join('')}</div>
    ${q?`<div class="dq">${esc(q)}<small>${ref(e,n.a)}${n.b>n.a?'–'+n.b:''}</small></div>`:`<div class="dq"><small>lines ${ref(e,n.a)}–${n.b}</small></div>`}</div>
    <div class="dsec"><b>What it says</b>${esc(n.meaning)}</div>
    <div class="dsec"><b>Why it matters</b>${esc(n.effect)}</div>
    ${n.ask?`<div class="dsec"><b>Ask yourself</b>${esc(n.ask)}</div>`:''}
    ${n.stretch?`<div class="dsec"><b>Stretch</b>${esc(n.stretch)}</div>`:''}
    <div class="dsec"><b>To remember</b>${esc(n.rev)}</div>
    <div class="dsec"><b>How secure is this?</b><div class="rate"><button class="r1" data-rate="1" aria-pressed="${rt===1}">Revisit</button><button class="r2" data-rate="2" aria-pressed="${rt===2}">Unsure</button><button class="r3" data-rate="3" aria-pressed="${rt===3}">Got it</button></div></div>
    <div class="btnrow"><button class="btn ghost" data-nstep="-1" ${i<=0?'disabled style="opacity:.4"':''}>← Previous note</button><button class="btn ghost" data-nstep="1" ${i>=list.length-1?'disabled style="opacity:.4"':''}>Next note →</button></div>`;
  } else {
    t.textContent='Find in Act 1';
    b.innerHTML=`<div class="find"><input id="fq" type="search" placeholder="Search a word, e.g. honest" value="${esc(S.drawer.q||'')}" aria-label="Search Act 1"><div class="pillrow" style="margin:8px 0">${['honest','seem','duty','daughter','thief','eyes','Moor','fair','black'].map(w=>`<button class="tag" data-fp="${w}">${w}</button>`).join('')}</div><div id="fres"></div></div>`;
    runFind(S.drawer.q||'');
    setTimeout(()=>{const i=$('#fq');if(i&&!S.drawer.q)i.focus()},50);
  }
}
const PLAY=D.play;
function runFind(q){
  const out=$('#fres'); if(!out)return; q=q.trim();
  if(q.length<2){out.innerHTML='<p class="tools-note">Type at least two letters. The search covers every line of Act 1 in the class edition.</p>';return}
  const re=new RegExp('(?<![\\p{L}])('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/'/g,'[’\']')+'[\\p{L}’\']*)','giu');
  const hits=[];PLAY.forEach((r,i)=>{ if(re.test(r[3])){hits.push(i)} re.lastIndex=0; });
  const html=hits.slice(0,60).map(i=>{const r=PLAY[i];return `<div class="res" data-hit="${i}"><small>1.${r[0]}.${r[1]} · ${esc(r[2])}</small>${esc(r[3]).replace(new RegExp('(?<![\\p{L}])('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'[\\p{L}’\']*)','giu'),'<mark>$1</mark>')}</div>`}).join('');
  out.innerHTML=`<p class="tools-note">${hits.length} line${hits.length===1?'':'s'}${hits.length>60?' (first 60 shown)':''}. Tap a line for context.</p>`+html;
}
function showCtx(i){
  const el=$(`.res[data-hit="${i}"]`); if(!el||el.nextElementSibling&&el.nextElementSibling.classList.contains('ctx'))return;
  const r=PLAY[i], prev=PLAY[i-1], next=PLAY[i+1];
  const d=document.createElement('div');d.className='ctx';
  const ex=D.extracts.find(e=>e.scene===r[0]&&r[1]>=e.range[0]&&r[1]<=e.range[1]);
  d.innerHTML=`<div class="ctxln">${prev&&prev[0]===r[0]?`${esc(prev[2])}: ${esc(prev[3])}`:''}</div><div class="ctxln">${next&&next[0]===r[0]?`${esc(next[2])}: ${esc(next[3])}`:''}</div>${ex?`<button class="link" data-gotoex="${ex.id}">Open in ${esc(ex.label)}</button>`:'<span class="tools-note">This line is not in a set extract.</span>'}`;
  el.after(d);
}

/* ---------- tooltip for words ---------- */
function showTip(el){
  const g=GLMAP[el.dataset.g]; if(!g)return; const tip=$('#tip');
  tip.innerHTML=`<b>${esc(g[0])}</b>${esc(g[1])}`; tip.hidden=false;
  const r=el.getBoundingClientRect(); const w=tip.offsetWidth,h=tip.offsetHeight;
  let x=Math.min(Math.max(8,r.left),innerWidth-w-8), y=r.bottom+8; if(y+h>innerHeight-8)y=r.top-h-8;
  tip.style.left=x+'px';tip.style.top=Math.max(8,y)+'px';
}
function hideTip(){$('#tip').hidden=true}

/* ---------- events ---------- */
document.addEventListener('click',ev=>{
  const t=ev.target; const q=sel=>t.closest(sel);
  let el;
  if((el=q('.gw'))){ev.stopPropagation();showTip(el);return}
  if(!q('#tip'))hideTip();
  if((el=q('[data-theme]'))){S.theme=S.theme===el.dataset.theme?null:el.dataset.theme;render();return}
  if((el=q('[data-lens]'))){const k=el.dataset.lens;S[k]=!S[k];store.set(k,S[k]);render();return}
  if((el=q('[data-tagf]'))){const k=el.dataset.tagf; if(TAG[k].kind==='theme'){S.theme=k;render();} return}
  if((el=q('[data-say]'))){const k=el.dataset.say; if(S.open.has(k))S.open.delete(k);else S.open.add(k); const [id,ci]=k.split(':');const g=$('#g-'+id+'-'+ci); if(g){g.hidden=!S.open.has(k)&&!S.plain; el.setAttribute('aria-expanded',!g.hidden)} return}
  if((el=q('[data-step]'))){ if(el.dataset.mark){S.done[S.lesson+':'+S.step]=1;store.set('done',S.done)} go('lesson-'+S.lesson+(el.dataset.step==='aims'?'':'-'+el.dataset.step)); return}
  if((el=q('[data-finish]'))){S.done[S.lesson+':'+S.step]=1;store.set('done',S.done); go(S.lesson<3?'lesson-'+(S.lesson+1):'revise'); return}
  if((el=q('[data-lt]'))){S.lensTab=el.dataset.lt;const e=EX[S.step];$$('[data-lt]').forEach(b=>b.setAttribute('aria-selected',b===el));$('#lenstext').textContent=e.lens[S.lensTab];return}
  if((el=q('mark.hl[data-n],button[data-n]'))){ev.preventDefault();openDrawer('note',el.dataset.n);return}
  if((el=q('[data-gonote]'))){const id=el.dataset.gonote,n=NOTE[id];S.pendingNote=id;go('lesson-'+EX[n.ex].lesson+'-'+n.ex);return}
  if((el=q('[data-gotoex]'))){const e=EX[el.dataset.gotoex];go('lesson-'+e.lesson+'-'+e.id);return}
  if((el=q('[data-go]'))){go(el.dataset.go);return}
  if((el=q('[data-gt]'))){S.gtab=el.dataset.gt;go('guide-'+S.gtab);return}
  if((el=q('[data-rt]'))){S.rv.tab=el.dataset.rt;go('revise-'+S.rv.tab);return}
  if((el=q('[data-rvt]'))){S.rv.theme=el.dataset.rvt||null;render();return}
  if((el=q('[data-rvr]'))){S.rv.rate=el.dataset.rvr;render();return}
  if((el=q('[data-flip]'))){S.card.flip=!S.card.flip;render();return}
  if((el=q('[data-card]'))){const v=el.dataset.card;S.card.flip=false;S.card.i=v==='r'?Math.floor(Math.random()*999):Math.max(0,S.card.i+(+v)+Object.values(NOTE).filter(n=>n.ph).length);render();return}
  if((el=q('[data-qa]'))){const i=+el.dataset.qa;S.qz.ans=i;if(i===D.quiz[S.qz.i].c)S.qz.score++;render();return}
  if((el=q('[data-qz]'))){const k=el.dataset.qz; if(k==='reset')S.qz={i:0,score:0,ans:null,done:false}; else {if(S.qz.i<D.quiz.length-1){S.qz.i++;S.qz.ans=null}else S.qz.done=true} render();return}
  if((el=q('[data-rate]'))){const id=S.drawer.id,v=+el.dataset.rate; if(S.rate[id]===v)delete S.rate[id];else S.rate[id]=v; store.set('rate',S.rate);drawerBody();return}
  if((el=q('[data-nstep]'))){const n=NOTE[S.drawer.id],e=EX[n.ex];const nx=e.notes[e.notes.indexOf(n)+(+el.dataset.nstep)];if(nx){S.drawer.id=nx.id;drawerBody();markOn();const mk=$(`mark.hl[data-n="${nx.id}"],.pin[data-n="${nx.id}"]`);if(mk)mk.scrollIntoView({block:'center',behavior:'smooth'})}return}
  if((el=q('[data-find]'))){openDrawer('find');S.drawer.q=el.dataset.find;drawerBody();return}
  if((el=q('[data-fp]'))){S.drawer.q=el.dataset.fp;drawerBody();return}
  if((el=q('.res'))&&el.dataset.hit){showCtx(+el.dataset.hit);return}
  if(q('#bFind')){S.drawer&&S.drawer.mode==='find'?closeDrawer():openDrawer('find');return}
  if(q('#bFocus')){S.focus=!S.focus;render();return}
  if(q('#bTheme')){const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark';store.set('themepref',r.dataset.theme);return}
  if(q('#dclose')||q('#scrim')){closeDrawer();return}
});
document.addEventListener('input',ev=>{ if(ev.target.id==='fq'){S.drawer.q=ev.target.value;runFind(ev.target.value)} });
document.addEventListener('keydown',ev=>{ if(ev.key==='Escape'){hideTip();if(S.drawer)closeDrawer()} });
window.addEventListener('scroll',hideTip,{passive:true});
window.addEventListener('hashchange',()=>{parseHash();render(); afterRender()});
function afterRender(){ if(S.pendingNote){const id=S.pendingNote;S.pendingNote=null; setTimeout(()=>{openDrawer('note',id);const mk=$(`mark.hl[data-n="${id}"],.pin[data-n="${id}"]`);if(mk)mk.scrollIntoView({block:'center'})},60)} }
try{const tp=store.get('themepref',null);if(tp)document.documentElement.dataset.theme=tp}catch(e){}
parseHash();render();afterRender();
})();
</script>
</body></html>
